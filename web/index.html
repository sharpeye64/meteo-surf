 #home .hm-srch{height:44px;background:#ffffff1c}#home .hm-srch input{font-size:16px}#home .hm-card h2{font-size:23px}#home .hm-pm b{font-size:30px}#home .hm-card{gap:10px}
 #home .hm-card .hm-meta{display:none}#home .hm-dl{font-size:13px;padding:9px 12px}#home .hm-pm div{padding:11px 14px}

.hmb-row2{animation-name:hmbMq3;backface-visibility:hidden;transform:translate3d(0,0,0)}
@keyframes hmbMq3{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.hmb-row2 .lv{animation:hmbBlink3 2.8s ease-in-out infinite;will-change:opacity}
@keyframes hmbBlink3{0%,58%,100%{opacity:.3}66%,78%{opacity:1}}
.hmb-tick2{contain:layout paint}
.hmb-v2.fl .hmb-tick2{-webkit-mask-image:none;mask-image:none}
/* bouton ⓘ des crédits : reste dans le coin en bas ; c'est la frise des bouées qui remonte pour lui laisser la place */

/* grand écran (≥ 1200 px) : les bouées passent en tête de la colonne de gauche, au-dessus de la recherche,

/* =====================================================================================================
   PAGE DE PRÉVISIONS V3 (26/11/2026) — la V1 comme référence : clair, chaleureux, chiffres forts, peu de traits.
   Bleu nuit = prévisions ; DORÉ = mesures réelles. Mode sombre en option (html[data-theme="dark"]).
   ===================================================================================================== */
html.v2{
  --pv-bg:#EEF1F2; --pv-card:#FFFFFF; --pv-soft:#F4F6F7; --pv-line:rgba(16,32,44,.08);
  --pv-ink:#10202C; --pv-ink2:#4A5A63; --pv-ink3:#7D8B92;
  --pv-gold:#C9A463; --pv-gold-ink:#7A5A16; --pv-gold-a:#FBF4E6; --pv-gold-b:#F1DDB4;
  --pv-off:#1F8A7C; --pv-side:#5B6B75; --pv-on:#C0582F; --pv-tide:#8C88C8;
  --pv-cellmix:100%; --pv-celltext:#10202C;
  background:var(--pv-bg);
}
html.v2[data-theme="dark"]{
  --pv-bg:#0B1418; --pv-card:#121E24; --pv-soft:#18252C; --pv-line:rgba(255,255,255,.07);
  --pv-ink:#EEF2F3; --pv-ink2:#B5C1C6; --pv-ink3:#84939A;
  --pv-gold:#E4C79B; --pv-gold-ink:#E9CFA5; --pv-gold-a:#1D2224; --pv-gold-b:#2A2620;
  --pv-off:#62C9B8; --pv-side:#9AABB2; --pv-on:#EC8F6E; --pv-tide:#A8A5DE;
  --pv-cellmix:42%; --pv-celltext:#F4F6F7;
  color-scheme:dark;
}
html.v2 body{background:var(--pv-bg);color:var(--pv-ink)}
html.v2 :focus-visible{outline:2px solid var(--pv-ink);outline-offset:2px;border-radius:8px}
.pv{max-width:1240px;margin:0 auto;padding:0 28px}
.pv-sp{flex:1}
.pv [hidden],.pv-chtip[hidden]{display:none!important}
.pv-fn{margin:12px 0 0;font:500 12.5px/1.5 Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-arr{width:11px;height:11px;fill:currentColor;margin-right:3px;display:inline-block;vertical-align:-1px}
.pv-live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pv-gold);margin-right:7px;vertical-align:1px;box-shadow:0 0 0 3px color-mix(in srgb,var(--pv-gold) 28%,transparent)}
.pv-tbtn{border:0;background:none;padding:6px 2px;font:700 13px Manrope,system-ui,sans-serif;color:var(--pv-ink3);cursor:pointer;border-bottom:1.5px solid transparent;transition:color .15s,border-color .15s}
.pv-tbtn:hover{color:var(--pv-ink)}
.pv-tbtn[aria-pressed="true"],.pv-tbtn[aria-expanded="true"]{color:var(--pv-ink);border-bottom-color:var(--pv-ink)}
.pv-tabs{display:inline-flex;gap:18px}
.pv-tabs button{border:0;background:none;padding:6px 0;font:800 13.5px Manrope,system-ui,sans-serif;color:var(--pv-ink3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.pv-tabs button:hover{color:var(--pv-ink)}
.pv-tabs button[aria-pressed="true"]{color:var(--pv-ink);border-bottom-color:var(--pv-ink)}

/* ---- barre du haut (V1) ---- */
.pv-top{display:flex;align-items:center;gap:16px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:6px}
.pv-brand{display:flex;align-items:center;gap:8px;text-decoration:none;flex:1 1 0}
.pv-pick{display:flex;align-items:center;gap:9px;height:44px;padding:0 14px 0 16px;border:0;border-radius:999px;background:var(--pv-card);color:var(--pv-ink);font:800 15px Manrope,system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(16,32,44,.06);transition:box-shadow .15s}
.pv-pick:hover{box-shadow:0 2px 10px rgba(16,32,44,.10)}
.pv-pick>svg:first-child{width:16px;height:16px;color:var(--pv-ink3)}
.pv-pick small{font:600 12.5px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-pick>svg:last-child{width:13px;height:13px;color:var(--pv-ink3)}
.pv-acts{flex:1 1 0;display:flex;justify-content:flex-end;gap:8px}
.pv-ib{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--pv-card);color:var(--pv-ink2);cursor:pointer;box-shadow:0 1px 2px rgba(16,32,44,.06)}
.pv-ib svg{width:19px;height:19px}
.pv-ib:hover{color:var(--pv-ink)}
.pv-fav svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.pv-fav[aria-pressed="true"]{background:var(--pv-ink);color:var(--pv-card)}
.pv-fav[aria-pressed="true"] svg{fill:currentColor}

/* ---- nom du spot et calendrier (V1) ---- */
.pv-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;padding-top:22px;padding-bottom:22px}
.pv-id{min-width:0}
.pv-hero h1{margin:0;font:700 clamp(32px,4.2vw,54px)/1 Unbounded,system-ui,sans-serif;letter-spacing:-.045em;color:var(--pv-ink)}
.pv-meta{display:flex;flex-wrap:wrap;margin:12px 0 0;font:600 14px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-meta span:first-letter{text-transform:uppercase}
.pv-meta span{white-space:nowrap}
.pv-meta>*+*:before{content:"·";margin:0 8px;color:var(--pv-ink3)}
.pv-meta a{color:var(--pv-ink2);text-decoration:none;font-weight:700}
.pv-meta a:hover{color:var(--pv-ink);text-decoration:underline}
.pv-days{display:flex;gap:8px;flex:none}
.pv-day{display:flex;flex-direction:column;align-items:center;justify-content:center;width:82px;height:96px;border:0;border-radius:18px;background:var(--pv-card);color:var(--pv-ink);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s,color .15s,transform .15s}
.pv-day:hover{transform:translateY(-1px)}
.pv-dn{font:800 11px Manrope,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.pv-dd{font:700 26px/1.1 Unbounded,system-ui,sans-serif;letter-spacing:-.04em;margin:2px 0 3px}
.pv-dm{font:700 13px Manrope,system-ui,sans-serif;opacity:.75}
.pv-dm small{font-size:11px}
.pv-day[aria-pressed="true"]{background:var(--pv-ink);color:var(--pv-card)}
.pv-day[aria-pressed="true"] .pv-dm,.pv-day[aria-pressed="true"] .pv-dn{opacity:.85}

/* ---- la carte principale ---- */
.pv-card{background:var(--pv-card);border-radius:28px}
.pv-hours{position:relative;padding:22px 26px 20px}
#sHour{top:0;scroll-margin-top:20px}
.pv-when{display:flex;align-items:center;gap:12px;min-height:28px}
.pv-wt{display:flex;align-items:center;gap:9px;font:800 12px Manrope,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--pv-ink2)}
.pv-ld{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--pv-ink3)}
.pv-ld.on{background:#2FB47C;border-color:#2FB47C;box-shadow:0 0 0 3px rgba(47,180,124,.2)}
.pv-nowb{margin-left:auto;text-transform:none}
.pv-sum{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:12px;margin-top:14px}
.pv-b{display:block;min-width:0;padding:18px 20px 18px 4px;border-radius:20px;color:inherit;text-decoration:none}
.pv-gold{padding-left:22px}
.pv-k{font:800 11px Manrope,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--pv-ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-v{margin-top:8px;font:700 46px/1 Unbounded,system-ui,sans-serif;letter-spacing:-.055em;color:var(--pv-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-v small{font:800 15px Manrope,system-ui,sans-serif;letter-spacing:0;color:var(--pv-ink3);margin-left:5px}
.pv-s{margin-top:10px;font:700 14px Manrope,system-ui,sans-serif;color:var(--pv-ink2);font-variant-numeric:tabular-nums}
.pv-s .pv-arr{width:12px;height:12px}
.pv-gold{position:relative;background:linear-gradient(120deg,var(--pv-gold-a),var(--pv-gold-b));transition:filter .15s}
.pv-gold:hover{filter:brightness(.985)}
.pv-gold .pv-k{color:var(--pv-gold-ink)}
.pv-gold .pv-s{color:var(--pv-gold-ink)}
.pv-gold.old .pv-v{opacity:.55}
.pv-gw{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.pv-gsp{width:120px;height:40px;flex:none;overflow:visible}
.pv-gsp .l{fill:none;stroke:var(--pv-gold-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.pv-gsp circle{fill:var(--pv-gold-ink)}
.pv-bar{display:flex;align-items:center;gap:18px;margin:22px 0 8px}
.pv-comp{margin:6px 0 12px;padding:16px 18px;border-radius:18px;background:var(--pv-soft)}
.pv-cmpo{display:flex;align-items:center;gap:22px}
.pv-rose{width:116px;height:116px;flex:none;overflow:visible}
.pv-rose .ring{fill:none;stroke:color-mix(in srgb,var(--pv-ink) 14%,transparent)}
.pv-rose .land{fill:color-mix(in srgb,#E4C79B 40%,transparent)}
.pv-rose text{font:800 8.5px Manrope,system-ui,sans-serif;fill:var(--pv-ink3);text-anchor:middle;dominant-baseline:central}
.pv-rose g line{stroke-linecap:round}
.pv-rose .c0 line{stroke:var(--pv-ink)} .pv-rose .c0 path{fill:var(--pv-ink)}
.pv-rose .c1 line{stroke:#6E88C2} .pv-rose .c1 path{fill:#6E88C2}
.pv-rose .c2 line{stroke:var(--pv-ink3)} .pv-rose .c2 path{fill:var(--pv-ink3)}
.pv-ctab{flex:1;min-width:0}
.pv-crow{display:grid;grid-template-columns:minmax(120px,1.4fr) 64px 50px minmax(70px,1fr);gap:8px;align-items:center;padding:6px 0;font:600 14px Manrope,system-ui,sans-serif;color:var(--pv-ink2);font-variant-numeric:tabular-nums}
.pv-crow b{color:var(--pv-ink)}
.pv-cn{color:var(--pv-ink);font-weight:700}
.pv-cn:before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:9px;vertical-align:middle;background:var(--pv-ink)}
.pv-cn.c1:before{background:#6E88C2} .pv-cn.c2:before{background:var(--pv-ink3)}

/* ---- tableau horaire : contraste et couleurs de la V1 ---- */
.pv-scroll{overflow-x:auto;margin:0 -26px;padding:4px 26px 4px;scrollbar-width:thin;overscroll-behavior-x:contain}
.pv-grid{display:grid;grid-template-columns:88px repeat(var(--n),minmax(56px,1fr));gap:4px;position:relative;min-width:max-content}
.pv-lab{position:sticky;left:0;z-index:4;grid-column:1;display:flex;flex-direction:column;justify-content:center;padding-right:8px;background:var(--pv-card);box-shadow:-26px 0 0 var(--pv-card);font:700 13px Manrope,system-ui,sans-serif;color:var(--pv-ink2)}
.pv-lab small{font:600 11px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-lab.pv-ml span{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-hh{display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;background:none;padding:0;font:700 14px Manrope,system-ui,sans-serif;color:var(--pv-ink3);cursor:pointer;font-variant-numeric:tabular-nums;line-height:1.1}
.pv-hh i{font:700 10px Manrope,system-ui,sans-serif;font-style:normal;color:#B08A3E}
.pv-hh .pv-hn{color:var(--pv-ink)}
.pv-hh:hover,.pv-hh.sel{color:var(--pv-ink)}
.pv-cl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:12px;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--pv-celltext)}
.pv-wv,.pv-pe,.pv-wi{background:color-mix(in srgb,var(--c) var(--pv-cellmix),var(--pv-card))}
.pv-wv b{font:700 21px Unbounded,system-ui,sans-serif;letter-spacing:-.06em}
.pv-pe b{font:800 15px Manrope,system-ui,sans-serif}
.pv-pe span{display:flex;align-items:center;font:700 11px Manrope,system-ui,sans-serif;opacity:.75}
.pv-pe .pv-arr{width:9px;height:9px;margin-right:2px}
.pv-wi b{font:800 16px Manrope,system-ui,sans-serif}
.pv-wa{width:16px;height:16px;margin:0}
.pv-ag{background:none}
.pv-dots{display:inline-flex;gap:3px}
.pv-dots i{width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,var(--pv-ink) 15%,transparent)}
.pv-dots.l3 i,.pv-dots.l2 i:nth-child(-n+2),.pv-dots.l1 i:first-child{background:var(--pv-ink2)}
.pv-night{opacity:.5}
.pv-m{background:var(--pv-soft);font:700 13px Manrope,system-ui,sans-serif;color:var(--pv-ink2)}
.pv-selc{position:relative;z-index:3;grid-column:2;margin:-3px;border:2.5px solid var(--pv-ink);border-radius:14px;pointer-events:none}
.pv-tide{position:relative;border-radius:12px;background:var(--pv-soft);overflow:hidden}
.pv-tide svg{position:absolute;inset:0;width:100%;height:100%}
.pv-ta{fill:color-mix(in srgb,var(--pv-tide) 22%,transparent)}
.pv-tl{fill:none;stroke:var(--pv-tide);stroke-width:2;vector-effect:non-scaling-stroke}
.pv-tx{position:absolute;transform:translateX(-50%);font:800 11px Manrope,system-ui,sans-serif;color:var(--pv-ink2);white-space:nowrap}
.pv-tx small{font-weight:600;color:var(--pv-ink3);font-size:10.5px}
.pv-tx.hi{top:4px} .pv-tx.lo{bottom:4px}
.pv-tnone{display:flex;align-items:center;justify-content:center;font:600 12px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-wn{margin-top:8px}

/* ---- 7 jours ---- */
.pv-chdays{position:relative;height:28px;margin:4px 34px 6px 34px}
.pv-chday{position:absolute;top:0;transform:translateX(-50%);height:26px;padding:0 10px;border:0;border-radius:999px;background:none;font:800 12px Manrope,system-ui,sans-serif;color:var(--pv-ink3);cursor:pointer;white-space:nowrap}
.pv-chday:hover{color:var(--pv-ink)}
.pv-chday.on{background:var(--pv-ink);color:var(--pv-card)}
.pv-chwrap{display:grid;grid-template-columns:34px minmax(0,1fr) 34px}
.pv-chp{position:relative;height:300px;cursor:crosshair;touch-action:pan-y}
.pv-chp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pv-c-s{stroke:var(--pv-line);stroke-width:1;vector-effect:non-scaling-stroke}
.pv-c-d{fill:color-mix(in srgb,var(--pv-ink) 4%,transparent)}
.pv-c-g{stroke:var(--pv-line);stroke-width:1;vector-effect:non-scaling-stroke}
.pv-c-b{fill:color-mix(in srgb,#6E88C2 22%,transparent)}
.pv-c-h{fill:none;stroke:var(--pv-ink);stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pv-c-t{fill:none;stroke:#3E9A6C;stroke-width:1.6;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
.pv-c-c{stroke:var(--pv-ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.pv-chax{position:relative;font:700 11px Manrope,system-ui,sans-serif;color:var(--pv-ink3);font-variant-numeric:tabular-nums}
.pv-chax span{position:absolute;transform:translateY(-50%)}
.pv-chax.l span{right:10px} .pv-chax.r span{left:10px;color:#3E9A6C}
.pv-chax .u{transform:translateY(-180%)}
.pv-chtip{position:absolute;top:8px;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;padding:8px 11px;border-radius:12px;background:var(--pv-ink);color:var(--pv-card);font:600 12px Manrope,system-ui,sans-serif;white-space:nowrap;pointer-events:none;opacity:.96}
.pv-chleg{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0 34px;font:700 12px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-chleg span:before{content:"";display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:7px;vertical-align:middle}
.pv-chleg .k-h:before{background:var(--pv-ink)} .pv-chleg .k-b:before{height:9px;background:color-mix(in srgb,#6E88C2 30%,transparent)}
.pv-chleg .k-t:before{background:repeating-linear-gradient(90deg,#3E9A6C 0 5px,transparent 5px 8px)} .pv-chleg .k-w:before{width:9px;height:9px;background:hsl(160 48% 74%)}

/* ---- sections ---- */
.pv-sec{margin-top:44px;scroll-margin-top:20px}
.pv-sh{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:0 4px 16px}
.pv-sh h2{margin:0;font:700 24px Unbounded,system-ui,sans-serif;letter-spacing:-.04em;color:var(--pv-ink)}
.pv-sh .pv-tabs{margin-left:auto}

/* mesure en mer : une seule carte dorée */
.pv-goldc{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;padding:28px 30px;border-radius:28px;background:linear-gradient(120deg,var(--pv-gold-a) 0%,var(--pv-gold-b) 100%)}
.pv-gk{font:800 14px Manrope,system-ui,sans-serif;color:var(--pv-gold-ink)}
.pv-gk span{font-weight:600;opacity:.75;margin-left:6px}
.pv-gv{margin:14px 0 10px;font:700 72px/1 Unbounded,system-ui,sans-serif;letter-spacing:-.06em;color:var(--pv-ink);font-variant-numeric:tabular-nums}
.pv-gv small{font:800 20px Manrope,system-ui,sans-serif;letter-spacing:0;color:var(--pv-gold-ink);margin-left:6px}
.pv-gs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 0;font:700 15px Manrope,system-ui,sans-serif;color:var(--pv-ink);font-variant-numeric:tabular-nums}
.pv-gs .pv-arr{width:12px;height:12px}
.pv-dot{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--pv-gold);margin:0 10px}
.pv-gn{margin:16px 0 0;font:500 13px/1.5 Manrope,system-ui,sans-serif;color:var(--pv-gold-ink);opacity:.85;max-width:42ch}
.pv-ga{display:inline-block;margin-top:14px;font:800 13.5px Manrope,system-ui,sans-serif;color:var(--pv-gold-ink);text-decoration:none}
.pv-ga:hover{text-decoration:underline}
.pv-gr{display:flex;flex-direction:column;justify-content:center;min-width:0}
.pv-bch{display:grid;grid-template-columns:40px minmax(0,1fr)}
.pv-bys{position:relative;font:700 11px Manrope,system-ui,sans-serif;color:var(--pv-gold-ink);opacity:.8}
.pv-bys span{position:absolute;right:10px;transform:translateY(-50%);white-space:nowrap}
.pv-bpl{position:relative;height:200px}
.pv-bpl svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pv-b-g{stroke:color-mix(in srgb,var(--pv-gold-ink) 15%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}
.pv-b-a{fill:color-mix(in srgb,var(--pv-gold) 28%,transparent)}
.pv-b-o{fill:none;stroke:#B48A3C;stroke-width:2.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
html.v2[data-theme="dark"] .pv-b-o{stroke:var(--pv-gold)}
.pv-b-f{fill:none;stroke:var(--pv-ink);stroke-width:1.4;stroke-dasharray:5 5;vector-effect:non-scaling-stroke;opacity:.55}
.pv-bdot{position:absolute;right:-6px;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--pv-card);border:3px solid #B48A3C}
.pv-bx{display:flex;justify-content:space-between;gap:10px;margin:8px 0 0 40px;font:600 11.5px Manrope,system-ui,sans-serif;color:var(--pv-gold-ink);opacity:.85}
.pv-bx>span:nth-child(2){text-align:center}
.pv-bx i{display:inline-block;width:12px;height:2.5px;border-radius:2px;vertical-align:middle;margin-right:5px}
.pv-bx i.o{background:#B48A3C} .pv-bx i.f{background:repeating-linear-gradient(90deg,var(--pv-ink) 0 4px,transparent 4px 7px);opacity:.6;margin-left:4px}

/* autour du spot */
.pv-sort{font:700 13px Manrope,system-ui,sans-serif;color:var(--pv-ink3);display:flex;align-items:center;gap:6px}
.pv-sort select{font:800 13px Manrope,system-ui,sans-serif;color:var(--pv-ink);background:none;border:0;padding:4px 2px;cursor:pointer}
.pv-near{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);border-radius:28px;overflow:hidden;background:var(--pv-card);min-height:480px}
.pv-nmap{position:relative;background:#DFE5E7}
html.v2[data-theme="dark"] .pv-nmap .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg) saturate(.55) brightness(.95)}
.pv-nside{display:flex;flex-direction:column;min-width:0;padding:10px 8px 12px}
.pv-nwhen{margin:8px 14px 6px;font:700 12px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-nr{display:flex;align-items:center;border-radius:16px;transition:background .12s}
.pv-nr:hover,.pv-nr.hl{background:var(--pv-soft)}
.pv-ng{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:left;color:inherit;cursor:pointer}
.pv-nn{flex:1;min-width:0}
.pv-nn b{display:block;font:800 15px Manrope,system-ui,sans-serif;color:var(--pv-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-nn small{display:block;margin-top:1px;font:600 12.5px Manrope,system-ui,sans-serif;color:var(--pv-ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-nv{display:flex;flex-direction:column;align-items:flex-end;flex:none;font-variant-numeric:tabular-nums}
.pv-nv b{font:700 19px Unbounded,system-ui,sans-serif;letter-spacing:-.05em;color:var(--pv-ink)}
.pv-nv b small{font:800 12px Manrope,system-ui,sans-serif;letter-spacing:0;color:var(--pv-ink3)}
.pv-nv>small{font:600 12px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-nc{width:40px;height:40px;flex:none;margin-left:6px;display:grid;place-items:center;border:0;background:none;cursor:pointer}
.pv-nc i{width:20px;height:20px;border-radius:7px;border:2px solid color-mix(in srgb,var(--pv-ink) 30%,transparent);transition:background .12s,border-color .12s}
.pv-nc[aria-pressed="true"] i{background:var(--pv-ink);border-color:var(--pv-ink);box-shadow:inset 0 0 0 3px var(--pv-card)}
.pv-nmap .mkp{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--pv-card);box-shadow:0 2px 8px rgba(16,32,44,.16);font:800 12.5px Manrope,system-ui,sans-serif;color:var(--pv-ink);white-space:nowrap;transform:translateY(-50%);transition:transform .15s,background .15s,color .15s}
.pv-nmap .mkp:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:7px}
.pv-nmap .mkp.sel{background:var(--pv-ink);color:var(--pv-card);height:30px;padding:0 13px}
.pv-nmap .mkd{width:9px;height:9px;border-radius:50%;background:var(--pv-card);border:2px solid var(--pv-ink3)}
.pv-nmap .pv-hl .mkp{transform:translateY(-50%) scale(1.1);background:var(--pv-ink);color:var(--pv-card)}
.pv-nmap .maplibregl-ctrl-group{box-shadow:none!important}
.pv-cmp{margin-top:14px;padding:18px 20px;border-radius:24px;background:var(--pv-card)}
.pv-cmpe{margin:14px 6px 0}
.pv-cmps{overflow-x:auto;margin:0 -20px;padding:0 20px}
.pv-cmpg{display:grid;grid-template-columns:150px repeat(var(--n),minmax(74px,1fr));gap:4px;min-width:max-content}
.pv-cmpt{text-align:center;font:700 13px Manrope,system-ui,sans-serif;color:var(--pv-ink3);padding-bottom:4px}
.pv-cmpn{position:sticky;left:0;z-index:2;display:flex;align-items:center;padding-right:8px;background:var(--pv-card);font:800 14px Manrope,system-ui,sans-serif;color:var(--pv-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-cmpn.me{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.pv-cmpc{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;border-radius:12px;background:color-mix(in srgb,var(--c,transparent) var(--pv-cellmix),var(--pv-card));color:var(--pv-celltext);font-variant-numeric:tabular-nums}
.pv-cmpc b{font:700 17px Unbounded,system-ui,sans-serif;letter-spacing:-.05em}
.pv-cmpc i{display:flex;align-items:center;font:700 11px Manrope,system-ui,sans-serif;font-style:normal;opacity:.75}
.pv-cmpc i .pv-arr{margin:0 0 0 3px}

/* fiabilité : deux chiffres, le détail à la demande */
.pv-rel{display:grid;grid-template-columns:1fr 1fr;border-radius:28px;background:var(--pv-card)}
.pv-rc{padding:26px 30px}
.pv-rc+.pv-rc{border-left:1px solid var(--pv-line)}
.pv-rk{font:800 11px Manrope,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--pv-ink3)}
.pv-rv{margin-top:12px;font:700 40px/1 Unbounded,system-ui,sans-serif;letter-spacing:-.055em;color:var(--pv-ink);font-variant-numeric:tabular-nums}
.pv-rv small{font:800 15px Manrope,system-ui,sans-serif;letter-spacing:0;color:var(--pv-ink3)}
.pv-rto{font:700 16px Manrope,system-ui,sans-serif;letter-spacing:0;color:var(--pv-ink3);margin:0 10px}
.pv-rs{margin:10px 0 0;font:600 14px Manrope,system-ui,sans-serif;color:var(--pv-ink2)}
.pv-strk{position:relative;height:6px;margin:18px 0 4px;border-radius:3px;background:var(--pv-soft)}
.pv-rng{position:absolute;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--pv-ink) 22%,transparent)}
.pv-md{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--pv-card);border:2.5px solid var(--pv-ink)}
.pv-more{margin-top:10px}
.pv-more summary{display:inline-flex;align-items:center;gap:6px;padding:8px 4px;font:700 13.5px Manrope,system-ui,sans-serif;color:var(--pv-ink3);cursor:pointer;list-style:none}
.pv-more summary::-webkit-details-marker{display:none}
.pv-more summary:after{content:"";width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.pv-more[open] summary:after{transform:rotate(225deg) translateY(-2px)}
.pv-more summary:hover{color:var(--pv-ink)}
.pv-morein{display:grid;grid-template-columns:1fr 1.4fr;gap:10px 40px;padding:20px 30px 22px;border-radius:24px;background:var(--pv-card)}
.pv-morein .pv-fn{grid-column:1/-1;margin-top:6px}
.pv-mk{margin:0 0 8px;font:800 11px Manrope,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--pv-ink3)}
.pv-mlist{list-style:none;margin:0;padding:0;font:600 14px Manrope,system-ui,sans-serif;color:var(--pv-ink2)}
.pv-mlist li{display:flex;justify-content:space-between;padding:5px 0}
.pv-mlist b{color:var(--pv-ink);font-variant-numeric:tabular-nums}
.pv-mlist li.ret{margin-top:4px;padding-top:9px;border-top:1px solid var(--pv-line);color:var(--pv-ink)}
.pv-rtab{width:100%;border-collapse:collapse;font:600 13.5px Manrope,system-ui,sans-serif;color:var(--pv-ink2);font-variant-numeric:tabular-nums}
.pv-rtab th,.pv-rtab td{padding:6px 8px 6px 0;text-align:left}
.pv-rtab thead th{font:700 11.5px Manrope,system-ui,sans-serif;color:var(--pv-ink3)}
.pv-rtab tbody th{color:var(--pv-ink);font-weight:700}
.pv-rtab td:first-of-type{color:var(--pv-ink);font-weight:800}

/* pied de page */
html.v2 .pv-foot footer{color:var(--pv-ink3)}
html.v2 .pv-foot footer h3{color:var(--pv-ink)}
html.v2 .pv-foot footer a{color:var(--pv-ink2)}
html.v2 .pv-foot footer .fgrid,html.v2 .pv-foot footer .spotlinks{border-color:var(--pv-line)}
html.v2 .pv-foot .allspots summary{color:var(--pv-ink)}
.pv-foot{max-width:1240px;padding:0 28px}

/* ---- écrans moyens ---- */
@media (max-width:1180px){
  .pv-hero{flex-direction:column;align-items:stretch;gap:20px}
  .pv-days{overflow-x:auto;scrollbar-width:none;margin:0 -28px;padding:0 28px}
  .pv-days::-webkit-scrollbar{display:none}
  .pv-day{flex:0 0 auto}
}
@media (max-width:900px){

}

  .pv-chdays{margin:4px 26px 6px 26px}
  .pv-chwrap{grid-template-columns:26px minmax(0,1fr) 26px}
  .pv-chp{height:220px}
  .pv-chleg{margin-left:0}
  .pv-sec{margin-top:32px}

function seaPoint(s){ // point à ~3 km au large, pour éviter les mailles « terre » du modèle de vagues

const CACHE_TTL = 45*60*1000, memCache = {};
function ckey(url){ let h=0; for(let i=0;i<url.length;i++){ h=(h*31+url.charCodeAt(i))|0; } return 'om:'+h; }
async function getJSON(url, tries=2){
  const k=ckey(url), now=Date.now();
  if(memCache[k] && now-memCache[k].t<CACHE_TTL) return memCache[k].d;
  try{ const c=JSON.parse(localStorage.getItem(k)||'null'); if(c && now-c.t<CACHE_TTL){ memCache[k]=c; return c.d; } }catch(e){}
  const r=await fetch(url);
  if(r.status===429 && tries>1){ await new Promise(res=>setTimeout(res,2500)); return getJSON(url,tries-1); }
  if(!r.ok){ const err=new Error(r.status===429?'trop de requêtes':String(r.status)); err.status=r.status; throw err; }
  const j=await r.json(); if(j&&j.error) throw new Error(j.reason||'erreur');
  const d=Array.isArray(j)?j:[j]; memCache[k]={t:now,d};

}

function gridPoints(list){ const pts=[], idx={}, map=list.map(p=>{ const k=(Math.round(p[0]/0.03)*0.03).toFixed(3)+','+(Math.round(p[1]/0.03)*0.03).toFixed(3); if(!(k in idx)){ idx[k]=pts.length; pts.push(p); } return idx[k]; }); return {pts,map}; }

async function loadLive(){

  const wUrl = FORECAST+llq(land.pts)+COMMON+'&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&models=meteofrance_seamless';
  const [Mu,Wu] = await Promise.all([ getJSON(mUrl).catch(e=>{throw new Error('vagues : '+e.message)}), getJSON(wUrl).catch(e=>{throw new Error('vent : '+e.message)}) ]);
  state.raw = SPOTS.map((s,i)=>({ m: structuredClone(Mu[sea.map[i]]), w: structuredClone(Wu[land.map[i]]) }));

async function enrich(i){

  const sp=seaPoint(s), q='latitude='+sp[0].toFixed(4)+'&longitude='+sp[1].toFixed(4);
  const tryModel = async (key,names) => { const order = modelName[key] ? [modelName[key]] : names;
    for(const n of order){ try{ const d=await getJSON(MARINE+q+COMMON+'&cell_selection=sea&hourly=wave_height,wave_period,wave_direction&models='+n,1); modelName[key]=n; return d[0]; }catch(e){ if(e.status===429) return null; } } return null; };

function tideFactor(pref, phase, rising){

function analyse(s, m, w){

    const swDom = sw!=null && H && sw>=0.4*H && g('swell_wave_period')!=null;
    const T = swDom ? g('swell_wave_period') : g('wave_period');
    const D = swDom && g('swell_wave_direction')!=null ? g('swell_wave_direction') : g('wave_direction');

    else if(w2!=null && w2>=0.3 && w2>=0.4*(H||0) && g('wind_wave_period')!=null) sec={kind:'mer du vent',H:w2,T:g('wind_wave_period'),D:g('wind_wave_direction')};
    const v = w.hourly.wind_speed_10m[i], wd = w.hourly.wind_direction_10m[i];
    // trains de houle bruts (pour « Composition de la houle ») : on garde les valeurs du modèle telles quelles
    const cp=(a,b,c)=>({H:g(a),T:g(b),D:g(c)}), comp=(g('swell_wave_height')!=null||g('wind_wave_height')!=null)?{sw:cp('swell_wave_height','swell_wave_period','swell_wave_direction'),s2:cp('secondary_swell_wave_height','secondary_swell_wave_period','secondary_swell_wave_direction'),ww:cp('wind_wave_height','wind_wave_period','wind_wave_direction')}:null;
    hours.push({time:t[i], date:t[i].slice(0,10), hour:+t[i].slice(11,13), H, T, D, sec, comp, v, wd, gust:w.hourly.wind_gusts_10m?.[i], lvl:lvl[i], sst:m.hourly.sea_surface_temperature?.[i]});

    if(h.H==null||h.v==null){h.score=null;return;}
    const expo = (()=>{const d=angDiff(h.D,s.ori); return d<=45?1:d<=75?0.75:d<=100?0.45:0.2;})();
    const Heff = h.H*expo*clamp((h.T||8)/10,0.6,1.35);
    h.Heff=Heff;
    let sc;
    if(Heff<s.min*0.7) sc=0;
    else if(Heff<s.min) sc=0.8;

  const days = Object.keys(byDate).slice(0,7).map(date=>summarise(date, byDate[date], sun[date]));
  return {spot:s, hours, days};
}

function summarise(date, list, sun){
  const rise = sun? +sun.rise.slice(0,2) : 8, set = sun? +sun.set.slice(0,2) : 18;
  const day = list.filter(h=>h.hour>=rise && h.hour<=set && h.score!=null);
  const dt = new Date(date+'T12:00:00');
  const label = DAYS_FR[dt.getDay()]+' '+dt.getDate();
  if(!day.length) return {date,label,score:0,tag:'—',verdict:'Pas de données pour ce jour.',size:'—',list,sun};
  let best = day.reduce((a,b)=>b.score>a.score?b:a);
  const max = best.score;
  // fenêtre continue autour du meilleur créneau
  const bi = day.indexOf(best); let a=bi,b=bi;
  while(b-a<3){ const L=a>0&&day[a-1].score>=max-0.3?day[a-1].score:-1, R=b<day.length-1&&day[b+1].score>=max-0.3?day[b+1].score:-1;
    if(L<0&&R<0) break; if(L>=R) a--; else b++; }
  if(a===b){ if(b<day.length-1&&(a===0||day[b+1].score>=day[a-1].score)) b++; else if(a>0) a--; } // au moins 2 h
  const win = day.slice(a,b+1);
  const hs = day.map(h=>h.H); const lo=Math.min(...hs), hi=Math.max(...hs);
  const size = (hi-lo<0.15)? '≈ '+fmt(hi)+' m' : fmt(lo)+'–'+fmt(hi)+' m';
  const sc = Math.round(max);
  const avgH = win.reduce((x,h)=>x+h.H,0)/win.length;
  const satHours = day.filter(h=>h.saturated).length;
  let verdict;
  if(satHours > day.length*0.6) verdict = 'Ça sature : trop gros pour ce spot. Cherche un spot plus abrité.';
  else if(max<0.6) verdict = 'Pas de surf.';
  else {
    const q = ['Pas de surf','Micro-surf','Petit surf','Bon surf','Très bon surf'][sc];
    const windTxt = {lisse:'plan d’eau lisse', offshore:'vent offshore', 'side-off':'vent side-off', 'de côté':'vent de côté', onshore:'vent onshore'}[best.wind];
    const span = win.length>=day.length-1 ? 'toute la journée' : 'de '+win[0].hour+'h à '+(win[win.length-1].hour+1)+'h';
    verdict = q+', vagues de '+fmt(avgH)+' m, '+windTxt+' '+span+'.';
    const late = day.filter(h=>h.hour>=15);
    if(late.length && late.every(h=>h.wind==='onshore') && best.wind!=='onshore') verdict += ' Le vent rentre onshore l’après-midi.';
  }
  return {date,label,score:Math.round(max*10)/10,sc,tag:TAGS[sc],verdict,size,best,win,list,sun,avgH};
}

  float waves(vec2 p, float dist, out vec2 g){

    vec3 lo=toL(ro-bb), ld=toL(rd);

    vec3 so=lo/BH, sv=ld/BH; float A=dot(sv,sv), B=dot(so,sv), C=dot(so,so)-1., h=B*B-A*C;

        base=mix(base,vec3(.9),(1.-smoothstep(0.,.03,abs(yy-.30)))*.55);                  /* liseré blanc */
        base=mix(base,vec3(.035,.06,.14),smoothstep(.78,.86,nl.y));                       /* panneau solaire sur le dessus */
        base*=.72+.28*smoothstep(0.,.3,yy);                                               /* salissures près de l'eau */

    vec4 mast=vec4(hullShade(vec3(.7,.71,.73),normalize(-rd+vec3(0.,.35,0.)),rd,.3),clamp((.05*BS-sm.x)/max(pw,1e-3)*.5+.5,0.,1.)*step(sm.y,tmax));

    vec3 lens=mix(hullShade(vec3(.5,.35,.05),normalize(-rd),rd,.9),vec3(1.,.84,.38)*2.3,clamp(bl*1.1,0.,1.));

  }
  void main(){
    vec2 q=gl_FragCoord.xy/r-.5; q.x*=r.x/r.y;

      float dist=-ro.y/rd.y; vec3 p=ro+rd*dist;

      float crest=clamp(h/(amp*.9*s+.05)*.5+.5,0.,1.);
      vec3 sss=wS*vec3(.6,1.1,1.05)*pow(crest,3.)*.55*(.4+.6*max(sd.y,0.))*(1.-night*.7);
      col=body*(.55+.45*crest)+sss;
      col+=sun*max(dot(n,sd),0.)*.07*(1.-night);
      col=mix(col,rs,fres*.78);
      float sp=max(dot(rf,sd),0.);

      vec3 nm=normalize(n+vec3(noise(p.xz*2.3+vec2(t*1.4,0.))-.5,0.,noise(p.xz*2.1+vec2(0.,-t*1.2)+7.)-.5)*.32);
      float sp2=max(dot(reflect(rd,nm),sd),0.);
      float tw=smoothstep(.74,.96,noise(gl_FragCoord.xy/2.6+vec2(t*4.,-t*6.)));
      col+=sun*(pow(sp2,200.)*2.4*tw*(.35+.65*lowSun()) + pow(sp,1400.)*5. + pow(sp,90.)*.3*(.3+.7*lowSun()) + pow(sp,14.)*.05)*(1.-night*.6);
      float foam=0.; if(crest>.72) foam=smoothstep(.72,1.,crest)*smoothstep(.25,1.,amp)*exp(-dist*.02)*smoothstep(.45,.75,fbm(p.xz*.35+t*.2));
      foam=max(foam,exp(-pow((length(p.xz-bb.xz)-1.2*BS)/.2,2.))*1.3);                       /* écume autour de la coque */
      col=mix(col,vec3(.88,.92,.95)*(1.-night*.6),foam*.55);
      col=mix(col,mix(sB,wD*1.5+vec3(.02),.28),(1.-exp(-dist*.0035))*.82);
    }
    { vec3 g1; vec4 bu=buoy(ro,rd,tw,g1); col=mix(col,bu.rgb,bu.a); col+=g1; }
    col=mix(col,1.-exp(-col*1.7),.55);
    vec2 v=gl_FragCoord.xy/r-.5; col*=1.-.22*dot(v,v)*1.8;

  }`;
  const mk=(type,src)=>{ const sh=gl.createShader(type); gl.shaderSource(sh,src); gl.compileShader(sh); if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };

    const pr=gl.createProgram(); gl.attachShader(pr,mk(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return false;

}
function oceanInit(){
  return;   // plus d'océan animé : la page est claire et sobre
  if(OC.canvas) return;                                   // jamais deux fois
  const c=document.getElementById('ocean'); if(!c) return; OC.canvas=c;
  try{ OC.gl=c.getContext('webgl',{antialias:false,premultipliedAlpha:false,powerPreference:'low-power'}); }catch(e){ OC.gl=null; }
  if(OC.gl&&!oceanBuild()) OC.gl=null;
  c.addEventListener('webglcontextlost',e=>{ e.preventDefault(); OC.lost=true; });
  c.addEventListener('webglcontextrestored',()=>{ OC.lost=false; if(!oceanBuild()) OC.gl=null; oceanKick(); });
  if('IntersectionObserver' in window) new IntersectionObserver(e=>{ OC.visible=e[0].isIntersecting; if(OC.visible) oceanKick(); }).observe(c);
  if('ResizeObserver' in window) OC.ro=new ResizeObserver(()=>oceanSync());
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) oceanKick(); });
  OC.still=REDUCED;
}
function oceanDraw(now){
  const c=OC.canvas; if(!c) return;
  if(!OC.gl){   // sans WebGL : simple dégradé de ciel et de mer
    const p=palette(canon(OC.hour??state.hour)), rgb=v=>`rgb(${v.map(x=>Math.round(clamp(x,0,1)*255)).join(',')})`;
    c.style.background=`linear-gradient(180deg,${rgb(p.sT)} 0%,${rgb(p.sB)} 46%,${rgb(p.wS)} 52%,${rgb(p.wD)} 100%)`; return;
  }
  if(OC.lost) return;
  const gl=OC.gl, dpr=Math.min(window.devicePixelRatio||1,1.25)*OC.quality;
  const W=Math.max(2,Math.floor(c.clientWidth*dpr)), H=Math.max(2,Math.floor(c.clientHeight*dpr));
  if(c.width!==W||c.height!==H){ c.width=W; c.height=H; gl.viewport(0,0,W,H); }
  OC.hour+=(OC.hourT-OC.hour)*(now<OC.introUntil?0.025:0.08);        // glissement doux de l'heure : soleil et couleurs
  const p=palette(canon(OC.hour)), sv=sunVec(OC.hour,W<H), deg=Math.asin(clamp(sv[1],-1,1))*180/Math.PI;
  const night=clamp((-deg-0.8)/6,0,1);
  const sd=night>0.5?[Math.sin(0.3)*Math.cos(0.38),Math.sin(0.38),Math.cos(0.3)*Math.cos(0.38)]:sv;   // la nuit : lune à place fixe
  gl.uniform2f(OC.u.swD,-0.12,-0.99); gl.uniform1f(OC.u.swL,90); gl.uniform1f(OC.u.chop,0.8);         // mer calme et décorative
  const tsec=REDUCED?8:(now-OC.t0)/1000, bz=46, bx=bz*((W/H<.8?.72:.8)-.5)*(W/H)/OC_F, sw=swellAt(bx,bz,tsec,0.55,90,[-0.12,-0.99]);
  const ph5=(tsec%5)/5, flash=Math.min(1,Math.max(0,ph5/.04))*(1-Math.min(1,Math.max(0,(ph5-.16)/.1)));   // un éclat toutes les 5 s
  gl.uniform3f(OC.u.bb,bx,sw.h*0.9,bz); gl.uniform2f(OC.u.bt,sw.gx*0.9,sw.gz*0.9); gl.uniform1f(OC.u.bl,0.06+flash*(0.3+0.7*night));
  gl.uniform2f(OC.u.r,W,H); gl.uniform1f(OC.u.t,tsec); gl.uniform1f(OC.u.amp,0.55); gl.uniform1f(OC.u.night,night);
  gl.uniform3fv(OC.u.sT,p.sT); gl.uniform3fv(OC.u.sB,p.sB); gl.uniform3fv(OC.u.sun,p.sun); gl.uniform3fv(OC.u.wD,p.wD); gl.uniform3fv(OC.u.wS,p.wS); gl.uniform3fv(OC.u.sd,sd);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function oceanLoop(now){
  OC.raf=0;
  if(!OC.gl||OC.lost||document.hidden||!OC.visible||document.body.classList.contains('homeOn')){ OC.raf=0; return; }           // en pause : reprend au retour (oceanKick)
  const dt=now-OC.last;
  if(dt<32){ OC.raf=requestAnimationFrame(oceanLoop); return; }       // 30 images/s au plus
  OC.last=now;
  if(dt<250){                                                          // qualité adaptative : on mesure, on réduit si trop lent
    OC.dtSum+=dt; OC.frames++;
    if(OC.frames>=30){ const avg=OC.dtSum/OC.frames; OC.frames=0; OC.dtSum=0;
      if(avg>52){ if(OC.quality>0.46) OC.quality=Math.max(0.45,OC.quality*0.75); else OC.still=true; } }
  }
  oceanDraw(now);
  const settling=Math.abs(OC.hour-OC.hourT)>0.01;
  if(OC.still&&!settling) return;                                      // trop lent ou mouvement réduit : image fixe
  OC.raf=requestAnimationFrame(oceanLoop);
}
function oceanKick(){ if(!OC.raf&&OC.gl&&!OC.lost&&!document.hidden&&OC.visible) OC.raf=requestAnimationFrame(oceanLoop); }
/* Le canvas prend la hauteur du haut de page (qui change selon le contenu et l'écran) */
function oceanSync(){
  const c=OC.canvas, hero=document.querySelector('.hero'); if(!c||!hero) return;
  const h=hero.offsetHeight; if(h&&Math.abs(c.offsetHeight-h)>1) c.style.height=h+'px';
  if(OC.ro){ OC.ro.disconnect(); OC.ro.observe(hero); }
  if(OC.hour==null) OC.hour=OC.hourT;
  if(!OC.raf){ OC.hour=OC.hourT; oceanDraw(performance.now()); }
  drawArc();
}
function oceanUpdate(){
  if(!OC.canvas) return;
  OC.hourT=state.hour;
  if(OC.hour==null){ const intro=!REDUCED&&!document.hidden; OC.hour=intro?(ocean.rise||8):state.hour; if(intro) OC.introUntil=performance.now()+4500; }
  heroSunTimes();
  oceanKick();
  if(!OC.raf){ OC.hour=OC.hourT; oceanDraw(performance.now()); }
}

function v5Compass(deg,color){

function buoySpark(cur){
  try{
    const L=cur.L, t1=new Date(L.time+':00').getTime(), obs=(cur.obs||[]).filter(o=>o.hs!=null&&t1-new Date(o.t.length<=16?o.t+':00':o.t).getTime()<=24*36e5);
    if(obs.length<4) return '';
    const P=[]; const n=Math.min(13,obs.length); for(let i=0;i<n;i++) P.push(obs[Math.round(i*(obs.length-1)/(n-1))].hs);
    const W=150,H=56, mx=Math.max(...P), mn=Math.min(...P), y=v=>H-10-(v-mn+.05)/(mx-mn+.1)*(H-24), x=i=>4+i*(W-16)/(P.length-1);
    let d=`M${x(0).toFixed(1)},${y(P[0]).toFixed(1)}`; for(let i=1;i<P.length;i++){ const cx=(x(i-1)+x(i))/2; d+=` C${cx.toFixed(1)},${y(P[i-1]).toFixed(1)} ${cx.toFixed(1)},${y(P[i]).toFixed(1)} ${x(i).toFixed(1)},${y(P[i]).toFixed(1)}`; }
    const lx=x(P.length-1), ly=y(P[P.length-1]);
    return `<svg class="spk" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><defs><linearGradient id="spg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2112" stop-opacity=".22"/><stop offset="1" stop-color="#2a2112" stop-opacity="0"/></linearGradient></defs><path d="${d} L${lx.toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z" fill="url(#spg)"/><path d="${d}" fill="none" stroke="#2a2112" stroke-width="2.2" stroke-linecap="round"/><circle class="p2" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="9" fill="#2a2112"/><circle class="p1" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="14" fill="#2a2112"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.6" fill="#fff" stroke="#2a2112" stroke-width="2.2"/></svg>`;
  }catch(e){ return ''; }
}
function inspBuoy(){

}

document.documentElement.dataset.theme=pvTheme();
const pvWindCol=w=>w==='onshore'?'var(--pv-on)':w==='de côté'?'var(--pv-side)':'var(--pv-off)';
const pvDayShort=x=>DAYS_FR[new Date(x.date+'T12:00').getDay()];
const pvDayLong=(x,j)=>j===0?'Aujourd’hui':j===1?'Demain':DAYS_LONG[new Date(x.date+'T12:00').getDay()].replace(/^./,c=>c.toUpperCase())+' '+(+x.date.slice(8,10));
const pvArr=(deg,cls)=>deg==null?'':`<svg class="pv-arr${cls?' '+cls:''}" viewBox="-6 -6 12 12" aria-hidden="true" style="transform:rotate(${Math.round((deg+180)%360)}deg)"><path d="M0 -5.2L3.8 4.2L0 2.3L-3.8 4.2Z"/></svg>`;
const pvIsNow=()=>!!state.live&&state.day===0&&state.hour===state.liveHour;
const pvHourOf=day=>{ const hr=clamp(Math.round(state.hour),0,23); return day.list.find(x=>x.hour===hr)||day.list[0]; };
const pvNice=v=>v<=2?Math.ceil(v*2)/2:v<=5?Math.ceil(v):Math.ceil(v/2)*2;

};

/* ---------- calendrier : comme la V1 (jour, date, hauteur), sans graphique ---------- */
function pvDayTab(x,j,k){
  if(x.tag==='—') return '';
  const m=dayMed(x);
  return `<button type="button" class="pv-day" data-d="${j}" aria-pressed="${j===k}" aria-label="${pvDayLong(x,j)} : houle ${m!=null?fmt(m)+' m':'indisponible'}"><span class="pv-dn">${j===0?'Auj.':pvDayShort(x)}</span><span class="pv-dd">${+x.date.slice(8,10)}</span><span class="pv-dm">${m!=null?fmt(m)+'<small> m</small>':'—'}</span></button>`;
}

/* ---------- bouée du résumé (dorée) ---------- */
function pvSparkObs(cur){
  try{
    const t1=new Date(cur.L.time+':00').getTime(), obs=(cur.obs||[]).filter(o=>o.hs!=null&&t1-new Date(o.t.length<=16?o.t+':00':o.t).getTime()<=24*36e5);
    if(obs.length<4) return '';
    const W=120,H=40, mx=Math.max(...obs.map(o=>o.hs)), mn=Math.min(...obs.map(o=>o.hs)), X=i=>(2+i*(W-8)/(obs.length-1)).toFixed(1), Y=v=>(H-6-(v-mn+.05)/(mx-mn+.1)*(H-14)).toFixed(1);
    const d=obs.map((o,i)=>(i?'L':'M')+X(i)+' '+Y(o.hs)).join(''), l=obs[obs.length-1];
    return `<svg class="pv-gsp" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path class="l" d="${d}"/><circle cx="${X(obs.length-1)}" cy="${Y(l.hs)}" r="3.4"/></svg>`;
  }catch(e){ return ''; }
}
function pvObsCell(s){
  try{
    const cur=pickBuoy(buoyChoices(s)); if(!cur) return '';
    const L=cur.L, a=cur.ageH, per=L.tp||cur.Tm;
    const when=a>=48?`aucune mesure depuis le ${dmy(L.time)}`:a<1?'à l’instant':ageTxt(a);
    return `<a class="pv-b pv-gold${a>6?' old':''}" href="#sRadar" title="Mesure réelle de la bouée ${cur.name} (${cur.kind==='coast'?'près de la côte':'au large'}). Ce n’est pas la taille des vagues sur le spot.">
      <div class="pv-k">${a<2?'<i class="pv-live"></i>':''}Bouée ${cur.name}</div>
      <div class="pv-gw"><div class="pv-v">${fmt(L.hs)}<small>m</small></div>${pvSparkObs(cur)}</div>
      <div class="pv-s">${per?`${L.tp?'':'≈ '}${Math.round(per)} s`:''}${L.dir!=null?` · ${pvArr(L.dir)}${sector(L.dir)}`:''} · ${when}</div></a>`;
  }catch(e){ return ''; }
}

/* ---------- détail de la houle (à la demande) ---------- */
function pvPt(b,r){ const a=b*Math.PI/180; return [(Math.sin(a)*r).toFixed(1),(-Math.cos(a)*r).toFixed(1)]; }
function pvRose(s,arrows){
  const R=40; let g='';
  if(s.ori!=null){ const a=pvPt(s.ori+90,R), b=pvPt(s.ori+270,R); g+=`<path class="land" d="M0 0L${a.join(' ')}A${R} ${R} 0 0 1 ${b.join(' ')}Z"/>`; }
  g+=`<circle class="ring" r="${R}"/>`;
  ['N','E','S','O'].forEach((l,i)=>{ const p=pvPt(i*90,R+10); g+=`<text x="${p[0]}" y="${p[1]}">${l}</text>`; });
  arrows.forEach(a=>{ if(a.deg==null) return; const o=pvPt(a.deg,R-2), e=pvPt(a.deg,R-2-(R-10)*clamp(a.len,.25,1));
    g+=`<g class="${a.cls}"><line x1="${o[0]}" y1="${o[1]}" x2="${e[0]}" y2="${e[1]}" stroke-width="${a.w}"/><path d="M0 -5L3.6 3L-3.6 3Z" transform="translate(${e.join(' ')}) rotate(${(a.deg+180)%360})"/></g>`; });
  return `<svg class="pv-rose" viewBox="-56 -56 112 112" role="img" aria-label="Directions d’où viennent les trains de houle ; le côté sable est la terre">${g}</svg>`;
}
function pvCompHtml(h){
  const s=state.data[state.spot].spot, c=h&&h.comp;
  const parts=c?[['Houle principale',c.sw,'c0'],['Houle secondaire',c.s2,'c1'],['Mer du vent',c.ww,'c2']].filter(p=>p[1]&&p[1].H!=null&&p[1].H>=0.05):[];
  if(!parts.length) return '<p class="pv-fn">Détail de la houle indisponible pour cette heure.</p>';
  const mx=Math.max(.3,...parts.map(p=>p[1].H));
  return `<div class="pv-cmpo">${pvRose(s,parts.map(([,p,cl])=>({deg:p.D,len:p.H/mx,cls:cl,w:1.4+1.8*p.H/mx})))}<div class="pv-ctab">${parts.map(([n,p,cl])=>`<div class="pv-crow"><span class="pv-cn ${cl}">${n}</span><b>${fmt(p.H)} m</b><span>${p.T?Math.round(p.T)+' s':'—'}</span><span>${p.D!=null?pvArr(p.D)+sector(p.D):'—'}</span></div>`).join('')}<p class="pv-fn">Trains de houle d’un seul modèle de vagues. La hauteur totale n’est pas leur somme.</p></div></div>`;
}

/* ---------- tableau horaire : contrasté comme la V1 ---------- */
function pvTable(day,hrs){
  const rise=day.sun?hDec(day.sun.rise):8, set=day.sun?hDec(day.sun.set):18, n=hrs.length;
  const liveH=state.live&&state.day===0?Math.round(state.liveHour):null, cf=state.coef&&state.coef[day.date];
  const L=(row,txt,unit,cls)=>`<div class="pv-lab${cls?' '+cls:''}" style="grid-row:${row}"><span>${txt}</span>${unit?`<small>${unit}</small>`:''}</div>`;
  let c=L(1,'')+L(2,'Vagues','m')+L(3,'Période','s')+L(4,'Accord','')+L(5,'Vent','km/h')+L(6,'Marée',cf&&cf.length?'coef '+Math.max(...cf):'');
  hrs.forEach((h,i)=>{
    const col=i+2, nt=(h.hour<Math.floor(rise)||h.hour>Math.floor(set))?' pv-night':'', at=r=>`data-h="${h.hour}" style="grid-column:${col};grid-row:${r}`;
    const tag=h.hour===liveH?'<i class="pv-hn">maint.</i>':h.hour===Math.floor(rise)?'<i>lever</i>':h.hour===Math.floor(set)?'<i>coucher</i>':'';
    const ag=agreeOf(h);
    c+=`<button type="button" class="pv-hh${nt}" ${at(1)}" aria-pressed="false" aria-label="${h.hour} h : ${h.H!=null?`houle ${fmt(h.H)} m, ${Math.round(h.T||0)} s${h.D!=null?' du '+sector(h.D):''}, vent ${Math.round(h.v)} km/h ${windWord[h.wind]||''}${h.gust!=null?', rafales '+Math.round(h.gust):''}`:'pas de données'}">${h.hour}h${tag}</button>`;
    c+=`<div class="pv-cl pv-wv${nt}" ${at(2)};--c:${sizeCol(h.H)}"><b>${h.H!=null?fmt(h.H):'—'}</b></div>`;
    c+=`<div class="pv-cl pv-pe${nt}" ${at(3)};--c:${periodCell(h.T)}"><b>${h.T?Math.round(h.T)+' s':'—'}</b>${h.D!=null?`<span>${pvArr(h.D)}${sector(h.D)}</span>`:''}</div>`;
    c+=`<div class="pv-cl pv-ag${nt}" ${at(4)}"${ag?` title="Modèles : de ${fmt(ag.mn)} à ${fmt(ag.mx)} m"`:''}>${ag?`<span class="pv-dots l${ag.lvl}" role="img" aria-label="Accord des modèles : ${AGREE_TXT[ag.lvl]}"><i></i><i></i><i></i></span>`:''}</div>`;
    c+=`<div class="pv-cl pv-wi${nt}" ${at(5)};--c:${windCell(h.v)}"${h.gust!=null?` title="${windWord[h.wind]||''} · rafales ${Math.round(h.gust)} km/h"`:''}>${h.wd!=null?pvArr(h.wd,'pv-wa'):''}<b>${h.v!=null?Math.round(h.v):'—'}</b></div>`;
  });
  const tl=hrs.filter(h=>h.tideN!=null);
  if(tl.length>2){
    const X=i=>((i+.5)/n*1000), Y=v=>(18+(1-v)*40);
    const pts=hrs.map((h,i)=>h.tideN!=null?[+X(i).toFixed(1),+Y(h.tideN).toFixed(1)]:null).filter(Boolean), d=smooth(pts);
    const step=n>1?hrs[1].hour-hrs[0].hour:1;
    const ex=(exactTides(state.spot,day.date)||extremes(day.list).map(x=>({type:x.t==='Pleine mer'?'PM':'BM',hm:x.h+'h',hd:x.h,h:null}))).filter(x=>x.hd>=hrs[0].hour-.5&&x.hd<=hrs[n-1].hour+.5);
    c+=`<div class="pv-tide" style="grid-column:2/-1;grid-row:6"><svg viewBox="0 0 1000 72" preserveAspectRatio="none" aria-hidden="true"><path class="pv-ta" d="${d}L${pts[pts.length-1][0]} 72L${pts[0][0]} 72Z"/><path class="pv-tl" d="${d}"/></svg>${ex.map(x=>{ const p=clamp(((x.hd-hrs[0].hour)/step+.5)/n*100,5,95); return `<span class="pv-tx ${x.type==='PM'?'hi':'lo'}" style="left:${p.toFixed(2)}%">${x.type} ${x.hm}${x.h!=null?` <small>${fmt(x.h)} m</small>`:''}</span>`; }).join('')}</div>`;
  } else c+=`<div class="pv-tide pv-tnone" style="grid-column:2/-1;grid-row:6">Marée indisponible</div>`;
  let row=7;
  if(state.cmp){
    (state.models||[]).forEach(md=>{ c+=L(row,shortModel(md.label),'','pv-ml'); hrs.forEach((h,i)=>{ const v=h.models?.[md.key]; c+=`<div class="pv-cl pv-m" data-h="${h.hour}" style="grid-column:${i+2};grid-row:${row}">${v!=null?fmt(v):'—'}</div>`; }); row++; });
    (state.windModels||[]).forEach(md=>{ c+=L(row,'Vent '+shortModel(md.label),'','pv-ml'); hrs.forEach((h,i)=>{ const v=h.wmodels?.[md.key]; c+=`<div class="pv-cl pv-m" data-h="${h.hour}" style="grid-column:${i+2};grid-row:${row}">${v!=null?Math.round(v):'—'}</div>`; }); row++; });
  }
  c+=`<div class="pv-selc" id="pvSel" style="grid-row:1/${row}" aria-hidden="true"></div>`;
  const rows=`40px 62px 56px 22px 62px 76px${state.cmp?' '+'30px '.repeat(row-7):''}`;
  return `<div class="pv-scroll" id="pvScroll"><div class="pv-grid" style="--n:${n};grid-template-rows:${rows}">${c}</div></div>`;
}
function markHour(){
  const g=document.querySelector('.pv-grid'); if(!g){ pvChartMark(); return; }
  const avail=[...g.querySelectorAll('.pv-hh')].map(x=>+x.dataset.h); if(!avail.length) return;
  const tg=Math.round(state.hour), hr=avail.reduce((b,x)=>Math.abs(x-tg)<Math.abs(b-tg)?x:b,avail[0]);
  g.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); g.querySelectorAll(`[data-h="${hr}"]`).forEach(x=>x.classList.add('sel'));
  g.querySelectorAll('.pv-hh').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.h===hr)));
  const f=g.querySelector(`.pv-hh[data-h="${hr}"]`), s=document.getElementById('pvSel'); if(f&&s) s.style.gridColumn=f.style.gridColumn;
}

/* ---------- graphique 7 jours (à la demande) : houle, fourchette des modèles, période, vent ---------- */
function pvChart(d,k){
  const dates=d.days.map(x=>x.date), H=d.hours.filter(h=>dates.includes(h.date)), N=H.length;
  if(N<24) return '<p class="pv-fn">Pas assez de données pour tracer la tendance.</p>';
  const hv=H.map(h=>h.H).filter(v=>v!=null), mv=H.flatMap(h=>Object.values(h.models||{}).filter(v=>v!=null));
  const top=pvNice(Math.max(1,...hv,...mv)), TT=20, vmax=Math.max(30,...H.map(h=>h.v||0));
  const W=1000, X=i=>+(i/(N-1)*W).toFixed(1), cw=W/(N-1);
  const yH=v=>+(140-(v/top)*128).toFixed(1), yT=v=>+(140-(Math.min(v,TT)/TT)*128).toFixed(1), yW=v=>+(206-(v/vmax)*44).toFixed(1);
  const seg=f=>{ let p='',on=false; H.forEach((h,i)=>{ const v=f(h); if(v==null){ on=false; return; } p+=(on?'L':'M')+X(i)+' '+v; on=true; }); return p; };
  const hp=seg(h=>h.H!=null?yH(h.H):null);
  const hi=H.map((h,i)=>{ const v=Object.values(h.models||{}).filter(x=>x!=null); return v.length>1?[i,Math.max(...v),Math.min(...v)]:null; }).filter(Boolean);
  const band=hi.length>2?`<path class="pv-c-b" d="M${hi.map(([i,a])=>X(i)+' '+yH(a)).join('L')}L${hi.slice().reverse().map(([i,,b])=>X(i)+' '+yH(b)).join('L')}Z"/>`:'';
  const wind=H.map((h,i)=>h.v!=null?`<rect x="${(X(i)-cw*.32).toFixed(1)}" y="${yW(h.v)}" width="${(cw*.64).toFixed(1)}" height="${(206-yW(h.v)).toFixed(1)}" style="fill:${windCell(h.v)}"/>`:'').join('');
  let seps='', dl='';
  d.days.forEach((x,j)=>{ const i0=H.findIndex(h=>h.date===x.date), i1=H.length-1-H.slice().reverse().findIndex(h=>h.date===x.date); if(i0<0) return;
    if(i0>0) seps+=`<line class="pv-c-s" x1="${(X(i0)-cw/2).toFixed(1)}" x2="${(X(i0)-cw/2).toFixed(1)}" y1="0" y2="210"/>`;
    if(j===k) seps+=`<rect class="pv-c-d" x="${Math.max(0,X(i0)-cw/2).toFixed(1)}" y="0" width="${(X(i1)-X(i0)+cw).toFixed(1)}" height="210"/>`;
    dl+=`<button type="button" class="pv-chday${j===k?' on':''}" data-d="${j}" style="left:${((X(i0)+X(i1))/2/W*100).toFixed(2)}%">${j===0?'Auj.':pvDayShort(x)} ${+x.date.slice(8,10)}</button>`; });
  const yt=[]; for(let v=0;v<=top+1e-9;v+=top<=2?.5:top<=5?1:2) yt.push(v);
  const pct=y=>(y/210*100).toFixed(2);
  return `<div class="pv-chart" id="pvChart">
    <div class="pv-chdays">${dl}</div>
    <div class="pv-chwrap"><div class="pv-chax l">${yt.map(v=>`<span style="top:${pct(yH(v))}%">${fmt(v).replace(',0','')}</span>`).join('')}<span class="u" style="top:${pct(yH(top))}%">m</span></div>
      <div class="pv-chp" id="pvChP"><svg viewBox="0 0 ${W} 210" preserveAspectRatio="none" aria-hidden="true">${seps}${yt.map(v=>`<line class="pv-c-g" x1="0" x2="${W}" y1="${yH(v)}" y2="${yH(v)}"/>`).join('')}${band}<path class="pv-c-h" d="${hp}"/><path class="pv-c-t" d="${seg(h=>h.T?yT(h.T):null)}"/>${wind}<line class="pv-c-c" id="pvChLine" x1="0" x2="0" y1="0" y2="210"/></svg><div class="pv-chtip" id="pvChTip" hidden></div></div>
      <div class="pv-chax r">${[0,10,20].map(v=>`<span style="top:${pct(yT(v))}%">${v}</span>`).join('')}<span class="u" style="top:${pct(yT(TT))}%">s</span></div></div>
    <div class="pv-chleg"><span class="k-h">Houle</span>${band?'<span class="k-b">Écart entre modèles</span>':''}<span class="k-t">Période</span><span class="k-w">Vent</span></div>
  </div>`;
}
function pvChartData(){ const d=state.data[state.spot], dates=d.days.map(x=>x.date); return d.hours.filter(h=>dates.includes(h.date)); }
function pvChartMark(){
  const ln=document.getElementById('pvChLine'); if(!ln) return;
  const d=state.data[state.spot], day=d.days[state.day], H=pvChartData(), hr=clamp(Math.round(state.hour),0,23);
  const i=H.findIndex(h=>h.date===day.date&&h.hour===hr); if(i<0) return; const x=(i/(H.length-1)*1000).toFixed(1); ln.setAttribute('x1',x); ln.setAttribute('x2',x);
}
function pvChartBind(){
  const p=document.getElementById('pvChP'), tip=document.getElementById('pvChTip'); if(!p) return;
  const H=pvChartData(), d=state.data[state.spot];
  const at=e=>{ const r=p.getBoundingClientRect(); return clamp(Math.round((e.clientX-r.left)/r.width*(H.length-1)),0,H.length-1); };
  p.addEventListener('pointermove',e=>{ const i=at(e), h=H[i], j=d.days.findIndex(x=>x.date===h.date), r=p.getBoundingClientRect();
    tip.hidden=false; tip.innerHTML=`<b>${pvDayLong(d.days[j],j)} · ${h.hour}h</b><span>${h.H!=null?fmt(h.H)+' m':'—'} · ${h.T?Math.round(h.T)+' s':'—'}${h.D!=null?' '+sector(h.D):''}</span><span>Vent ${h.v!=null?Math.round(h.v):'—'} km/h${h.wd!=null?' '+sector(h.wd):''}</span>`;
    tip.style.left=clamp(e.clientX-r.left,70,r.width-70)+'px'; });
  p.addEventListener('pointerleave',()=>{ tip.hidden=true; });
  p.addEventListener('click',e=>{ const h=H[at(e)], j=d.days.findIndex(x=>x.date===h.date); if(j<0) return;
    if(j!==state.day){ const y=scrollY; state.day=j; render(); scrollTo(0,y); }
    state.hour=h.hour; updateLive(); });
  document.querySelectorAll('.pv-chday').forEach(b=>b.onclick=()=>{ const y=scrollY; state.day=+b.dataset.d; render(); scrollTo(0,y); });
}

/* ---------- mesure en mer : une carte dorée, simple ---------- */
function pvBuoyChart(obs,fc,label){
  if(obs.length<4) return '<p class="pv-fn">Pas assez de mesures récentes pour tracer la courbe.</p>';
  const all=[...obs.map(o=>o.hs),...fc.map(o=>o.hs)], top=pvNice(Math.max(1,Math.max(...all)*1.12));
  const t0=new Date(obs[0].t).getTime(), t1=new Date(obs[obs.length-1].t).getTime(), span=Math.round((t1-t0)/36e5);
  const X=t=>((new Date(t).getTime()-t0)/(t1-t0||1)*1000).toFixed(1), Y=v=>(150-(v/top)*138).toFixed(1);
  const P=a=>a.map((o,i)=>(i?'L':'M')+X(o.t)+' '+Y(o.hs)).join('');
  const ly=+Y(obs[obs.length-1].hs);
  return `<div class="pv-bch"><div class="pv-bys"><span style="top:${(+Y(top)/152*100).toFixed(1)}%">${fmt(top)} m</span><span style="top:${(150/152*100).toFixed(1)}%">0</span></div>
    <div class="pv-bpl"><svg viewBox="0 0 1000 152" preserveAspectRatio="none" role="img" aria-label="Hauteur mesurée par la bouée sur ${span} heures, comparée à la prévision"><line class="pv-b-g" x1="0" x2="1000" y1="${Y(top/2)}" y2="${Y(top/2)}"/><path class="pv-b-a" d="${P(obs)}L1000 150L0 150Z"/>${fc.length>1?`<path class="pv-b-f" d="${P(fc)}"/>`:''}<path class="pv-b-o" d="${P(obs)}"/></svg><span class="pv-bdot" style="top:${(ly/152*100).toFixed(1)}%"></span></div></div>
    <div class="pv-bx"><span>il y a ${span} h</span><span><i class="o"></i>mesuré · <i class="f"></i>${label}</span><span>maintenant</span></div>`;
}
function radarHtml(s){
  const list=buoyChoices(s), cur=pickBuoy(list); if(!cur) return '';
  const L=cur.L, Tm=(!L.tp&&cur.Tm)?cur.Tm:null;
  let obs=cur.obs, fc, fLabel;
  if(cur.kind==='coast'){
    const d=state.data[state.spot], byT={}; d.hours.forEach(h=>{ if(h.H!=null) byT[h.time.slice(0,13)]=h.H; });

}

function relUpdate(h){
  const el=document.getElementById('relModels'); if(!el) return;
  const t=document.getElementById('relHr'); if(t) t.textContent=(pvIsNow()?'maintenant':h.hour+'h');
  const rows=(state.models||[]).map(md=>({l:shortModel(md.label),v:h.models&&h.models[md.key]})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v);
  const li=document.getElementById('relList');
  if(rows.length<2){ el.innerHTML='<p class="pv-rs">Pas assez de modèles disponibles à cette heure.</p>'; if(li) li.innerHTML=''; return; }
  const vs=rows.map(r=>r.v), mn=Math.min(...vs), mx=Math.max(...vs), lo=Math.max(0,Math.floor((mn-.3)*2)/2), hi=Math.ceil((mx+.3)*2)/2, P=v=>((v-lo)/(hi-lo)*100).toFixed(1), ag=agreeOf(h);
  el.innerHTML=`<div class="pv-rv">${fmt(mn)}<span class="pv-rto">à</span>${fmt(mx)}<small> m</small></div><p class="pv-rs">${rows.length} modèles${ag?` · accord ${AGREE_TXT[ag.lvl]}`:''}</p>
    <div class="pv-strk" aria-hidden="true"><i class="pv-rng" style="left:${P(mn)}%;width:${(P(mx)-P(mn)).toFixed(1)}%"></i>${rows.map(r=>`<i class="pv-md" style="left:${P(r.v)}%"></i>`).join('')}</div>`;
  if(li) li.innerHTML=rows.map(r=>`<li><span>${r.l}</span><b>${fmt(r.v)} m</b></li>`).join('')+`<li class="ret"><span>Valeur affichée (moyenne pondérée)</span><b>${h.H!=null?fmt(h.H)+' m':'—'}</b></li>`;
}

function pvNextTide(date,hour){
  const t=state.tides&&state.tides[state.spot]; if(!t||!t.extremes) return null;
  const ref=date+'T'+String(Math.floor(hour)).padStart(2,'0')+':'+String(Math.round((hour%1)*60)).padStart(2,'0');

}

    { const hm=document.getElementById('home'); if(HOME.colTop) hm.style.setProperty('--coltop',HOME.colTop+'px'); hm.classList.add('hm-sel'); } HOME.popAt=[b.lon,b.lat];
    P.innerHTML=`<div class="hmb-col"><div class="hmb-top"><div class="hmb-srch">${HM_ICON.srch}<span class="nm">Bouée ${b.n}</span></div><div class="hmb-chips"><button type="button" id="hmBk">← Toute la côte</button></div></div></div>
      <div class="hmb-dcard"><div class="hd"><span class="bd" style="background:linear-gradient(135deg,#f6e6bf,#e0bd7a)">${hmF(L.hs)}</span><div><h3>Bouée ${b.n}</h3><div class="sub">${b.sub}</div></div></div>
       <div class="nums"><div class="m${ageH>6?' old':''}"><small><i class="dt"></i>Hauteur mesurée</small><b>${hmF(L.hs)}<i> m</i></b></div>${L.hmax!=null?`<div class="a"><small>Vague max</small><b>${hmF(L.hmax)}<i> m</i></b></div>`:''}</div>
       <p class="cmp"><b>${tp}${dr}${sst}${ageTxt(ageH)}.</b> <span>Cette bouée mesure la mer en continu. Ce n’est pas la taille des vagues sur un spot précis.</span></p>
       ${link?`<a class="go" href="${link}">Voir la page de la bouée ${HM_ICON.go}</a>`:''}</div>`;
    document.getElementById('hmBk').onclick=()=>{ homeClear(); homeHomePanel(); homeFit(); homeDeclutter(); };
    homePlacePop();
  }
  if(HOME.map){ const mob=innerWidth<760; HOME.map.easeTo({center:[b.lon-(mob?0:.5),b.lat],zoom:9,pitch:0,duration:1000,offset:mob?[0,30]:[0,0]}); }
}
document.addEventListener('click',e=>{ const a=e.target.closest&&e.target.closest('.hero .brand'); if(a&&state.data){ e.preventDefault(); homeOpen(true); } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&HOME.on) homeClose(); });
if(window.visualViewport){ const vv=()=>document.documentElement.style.setProperty('--hmvh',visualViewport.height+'px'); visualViewport.addEventListener('resize',vv); visualViewport.addEventListener('scroll',vv); vv(); }
addEventListener('resize',()=>{ if(!HOME.on||!HOME.map) return; clearTimeout(HOME.rt); HOME.rt=setTimeout(()=>{ HOME.map.resize(); if(!document.querySelector('#home .hm-card')) homeFit(); },200); });

async function start(){
  oceanInit();
  window.addEventListener('resize',()=>{ if(state.data) oceanSync(); });
  try{
    await load();
    const showHome=homeWanted();   // avant render() : il écrit ?spot= dans l'adresse
    const favIdx = state.data.findIndex(x=>state.fav.includes(x.spot.name));
    state.spot = favIdx>=0 ? favIdx : 0;
    try{ const want=new URLSearchParams(location.search).get('spot'); if(want){ const j=state.data.findIndex(x=>slugOf(x.spot.name)===want); if(j>=0) state.spot=j; } }catch(e){}
    BOOT_HOME=showHome; render(); BOOT_HOME=false; refreshModels();
    if(showHome) homeOpen();
  }catch(err){
    document.getElementById('app').innerHTML=`<div class="loading"><div class="disp">Les prévisions n’ont pas pu être chargées</div><div style="color:var(--muted);max-width:46ch">${/trop de requêtes|429/.test(err.message)?'Le service météo gratuit limite le nombre de requêtes et la limite est atteinte. Attends une à deux minutes, puis réessaie.':err.message+'. Vérifie ta connexion internet, puis réessaie.'}</div><button class="retry" onclick="location.reload()">Réessayer</button></div>`;
  }
}
start();

/* ---------- Application installable (PWA) : mode hors ligne et message quand le réseau manque ---------- */
if('serviceWorker' in navigator){ addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
(function(){
  let bar=null;
  function show(){ if(navigator.onLine){ if(bar){ bar.remove(); bar=null; } return; }
    if(bar) return; bar=document.createElement('div'); bar.setAttribute('role','status');
    bar.style.cssText='position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 28px);padding:9px 16px;border-radius:999px;background:rgba(10,17,20,.92);border:1px solid rgba(255,255,255,.2);color:#fff;font:700 13px Manrope,system-ui,sans-serif;text-align:center';
    bar.textContent='Hors ligne : dernières prévisions enregistrées'; document.body.appendChild(bar); }
  addEventListener('online',show); addEventListener('offline',show); show();
})();
</script>
</body>
