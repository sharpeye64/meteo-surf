<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Météo surf — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --abyss:#04121A; --deep:#0A2230; --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --edge:rgba(255,255,255,.14);
  --text:#F3F1EC; --muted:#B5BFC2; --aqua:#3CD6B4; --gold:#FFB648; --onshore:#FF7A59; --coral:#FF7A59; --sand:#F2D3A2; --lilac:#B6A6FF; --dusk:#2B1C33;
  --q0:#55626A; --q1:#7FA7C4; --q2:#45C4B0; --q3:#F5C451; --q4:#FF7A45; --amb:#3A5C70; --ambSun:#FFD27A;
  color-scheme:dark;
}
@property --ambSun{syntax:'<color>';inherits:true;initial-value:#FFD27A}
:root{transition:--amb .8s ease,--ambSun .8s ease}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:radial-gradient(1500px 760px at 70% 980px,color-mix(in srgb,var(--amb) 28%,transparent),transparent 70%),radial-gradient(900px 700px at 10% 1500px,color-mix(in srgb,var(--ambSun) 12%,transparent),transparent 70%),var(--abyss)}
body{margin:0;background:transparent;color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:Unbounded,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* HERO */
.hero{position:relative;min-height:clamp(440px,62vh,700px);min-height:clamp(440px,62svh,700px);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.buoylbl{position:absolute;left:min(calc(72% + 40px),calc(100% - 290px));top:calc(46.3% - 16px);z-index:2;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#fff;text-decoration:none;padding:5px 11px;border-radius:999px;background:rgba(4,18,26,.55);border:1px solid rgba(255,255,255,.3);white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.buoylbl:hover{background:rgba(4,18,26,.78);border-color:#fff}
.buoylbl i{width:7px;height:7px;border-radius:50%;background:#FFC23D;box-shadow:0 0 8px #FFC23D;flex:none}
.buoylbl.old i{background:#8A949A;box-shadow:none}
.buoylbl small{font-weight:700;color:#CFE2E5;font-size:11px}
.buoylbl.inl{display:none;position:static}
@media (max-width:820px){.buoylbl.fl{display:none}.buoylbl.inl{display:inline-flex;align-self:flex-start;font-size:12px}}
.sunt{font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 5px rgba(0,0,0,.6)}
.camlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#fff;text-decoration:none;padding:5px 11px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(4,18,26,.38);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.camlink:hover{background:rgba(4,18,26,.62);border-color:#fff}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 45% at 22% 62%,rgba(4,18,26,.42),transparent 72%),linear-gradient(180deg,rgba(4,18,26,.28) 0%,rgba(4,18,26,0) 22%,rgba(4,18,26,0) 55%,rgba(4,18,26,.55) 85%,#04121A 100%)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0;max-width:1180px;width:100%;margin:0 auto}
.brand{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#ocean{position:absolute;top:0;left:0;width:100%;height:640px;z-index:-1;display:block;pointer-events:none}
.sunarc{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* les verres dépolis par-dessus une animation obligent à reflouter chaque image : on les retire dans le haut de page */
.hero .ans,.hero .glassbtn,.hero .hcomp,.hero .wkp,.hero .camlink,.hero .scrub{backdrop-filter:none;-webkit-backdrop-filter:none}
.hero .ans{background:linear-gradient(165deg,color-mix(in srgb,var(--acc) 20%,rgba(5,16,23,.9)) 0%,rgba(5,16,23,.88) 60%)}
.hero .hcomp,.hero .wkp{background:rgba(4,18,26,.62)}
@media (max-width:520px){ .glassbtn .lbl{display:none} #openPicker{width:44px;padding:0;justify-content:center} .scrub .head span{display:none} .hero::after{background:linear-gradient(180deg,rgba(4,18,26,.55) 0%,rgba(4,18,26,.25) 35%,rgba(4,18,26,.35) 60%,rgba(4,18,26,.9) 100%)} .heroBody{gap:16px;padding-top:24px} }
.brand i{width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--aqua),var(--gold),var(--coral),var(--lilac),var(--aqua));box-shadow:0 0 14px rgba(255,182,72,.6)}
.actions{display:flex;gap:8px}
.glassbtn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--edge);background:rgba(4,18,26,.35);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:8px;font-weight:700;cursor:pointer}
.glassbtn.icon{width:44px;padding:0;justify-content:center}
.glassbtn[aria-pressed="true"]{background:var(--gold);color:#1A1405;border-color:var(--gold)}
.heroBody{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:16px;max-width:1180px;width:100%;margin:0 auto;padding:clamp(48px,9vh,110px) 20px 44px}
.kicker{font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kicker .q{font-size:13px;padding:5px 12px;border-radius:999px;font-weight:800}
.decision{font-size:clamp(40px,6.6vw,80px);font-weight:800;line-height:1;max-width:16ch;text-shadow:0 2px 30px rgba(0,0,0,.45)}
.spotline{font-size:clamp(17px,2vw,20px);font-weight:700;max-width:50ch;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5),0 2px 18px rgba(0,0,0,.45)}
.spotline b{color:#fff}
.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1000px;margin-top:8px}
@media (max-width:820px){.answers{grid-template-columns:1fr 1fr}#tSize{grid-column:span 2}}
.ans.size{display:flex;gap:16px;align-items:center}
.ans .row{display:flex;align-items:center;gap:14px}
.ans .big{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(22px,3vw,30px);line-height:1.05;margin-top:4px}
.ans .mid{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(17px,2.2vw,21px);line-height:1.1;margin-top:4px}
.period{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.wlabel{font-weight:800;font-size:14px;margin-top:2px}
.tideline{display:block;width:100%;height:46px;margin-top:6px}
.tidetxt{font-size:13px;color:#CFE2E5}
.ok{color:var(--aqua);font-weight:700}
.kit{position:relative;z-index:2;margin:-28px auto 0;max-width:1180px;padding:0 20px}
.kit .in2{max-width:900px;background:linear-gradient(100deg,rgba(242,211,162,.16),rgba(255,122,89,.14) 55%,rgba(182,166,255,.14));border:1px solid rgba(242,211,162,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.kit .t{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:14px;color:var(--sand)}
.kit .it2{display:flex;align-items:center;gap:10px}
.kit .it2 .k{font-size:12px;color:var(--muted);font-weight:600}
.kit .it2 .v{font-weight:800}
.ans{--acc:#3CD6B4;position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--acc) 20%,rgba(5,16,23,.86)) 0%,rgba(5,16,23,.86) 60%);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;padding:18px 20px 16px;box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
.ans::before{content:"";position:absolute;left:20px;right:20px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
#tSize{--acc:#3CD6B4}#tWind{--acc:#FFB648}#tTide{--acc:#B6A6FF}
#tWind .row{gap:18px;margin-top:10px}#tWind .reldiag{width:92px;height:92px}#wdV{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(26px,3vw,34px);letter-spacing:-.02em}#wdL{font-size:15px;margin-top:4px}#tdV{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(20px,2.2vw,26px);margin-top:6px}
.ans .l{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:800;display:flex;align-items:center;gap:7px}
.ans .l i{display:none}
.ans .v{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(16px,2.3vw,22px);line-height:1.15;margin-top:4px}
.ans .s{font-size:13px;color:#CFE2E5;margin-top:2px}

/* HAUT DE PAGE : lecture en un coup d'œil */
.spotk{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 1px 5px rgba(0,0,0,.7),0 0 16px rgba(0,0,0,.35)}
.spotbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:800;color:#fff;padding:4px 0;border-bottom:1px dashed rgba(255,255,255,.45)}
.spotbtn:hover{border-bottom-color:#fff}.spotbtn:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:4px}
.verdict{margin:2px 0 0;display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap;line-height:1;text-shadow:0 2px 30px rgba(0,0,0,.45)}
.verdict .vq{color:#fff;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(36px,5.6vw,68px);letter-spacing:-.02em}
.verdict .vn{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:clamp(20px,2.6vw,30px);color:#fff}
.slot{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:16px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.slot .chip{font-size:14px;font-weight:800;padding:6px 12px;border-radius:999px;color:#0B1A14;text-shadow:none}
.slot .chip.none{background:rgba(4,18,26,.6);color:#fff;border:1px solid var(--edge)}
.slot .chip.a3{background:#45C4B0}.slot .chip.a2{background:#F5C451}.slot .chip.a1{background:#FF7A45}
.slot .trk{color:#CFE2E5;font-size:14px;font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}.slot .trk:hover{color:#fff}
.slot .tipbtn{margin-left:-4px}
.dots{display:inline-flex;gap:3px;align-items:center}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.22)}
.dots.a3 i.on{background:#45C4B0}.dots.a2 i.on{background:#F5C451}.dots.a1 i.on{background:#FF7A45}
.hacc{border-top:1px solid var(--edge)}
.wkp .cf{font-size:10px;font-weight:700;color:#9FB7BD;min-height:12px;white-space:nowrap}
.rel{margin-top:34px}
.relgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:10px}
@media (max-width:900px){.relgrid{grid-template-columns:1fr}}
.relc{border-radius:24px;border:1px solid var(--edge);background:rgba(255,255,255,.035);padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.relc .rk{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.rm{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;font-weight:600}
.rm .bar{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.rm .bar i{display:block;height:100%;background:#8ED0EC;border-radius:6px}
.rm b{font-family:Unbounded,system-ui,sans-serif;font-size:13px}
.rnote{font-size:13px;color:#9FB7BD;margin:0}.rempty{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:15px;margin:0}
.prog{height:6px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.prog i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#8ED0EC,#3CD6B4)}
.rtab{width:100%;border-collapse:collapse;font-size:12.5px}.rtab th,.rtab td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--edge)}
.rtab thead th{font-size:11px;color:var(--muted);font-weight:700}.rtab tbody th{font-weight:800}
.rsrc{margin:0;padding-left:18px;font-size:13px;color:#CFE2E5;display:flex;flex-direction:column;gap:6px}
.ans .val{font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:clamp(20px,2.6vw,30px);line-height:1.1;margin-top:6px;letter-spacing:-.01em}
.ans .sub{font-size:14px;color:#CFE2E5;margin-top:4px;font-weight:600}
.ans .sub2{font-size:13px;color:#9FB7BD;margin-top:2px}.ans .sub2:empty{display:none}
.week7{display:flex;gap:8px;margin-top:4px;max-width:1000px}
.wkp{flex:1 1 0;min-width:0;cursor:pointer;border-radius:14px;border:1px solid var(--edge);background:rgba(4,18,26,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit}
.wkp .d{font-size:12px;font-weight:700;color:#CFE2E5}.wkp .m{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:14px}
.wkp:hover{border-color:rgba(255,255,255,.5)}
.wkp[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 1px #fff}
@media (max-width:520px){ .answers{grid-template-columns:1fr!important;gap:8px} #tSize{grid-column:auto!important}
  .ans{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:2px 10px;padding:10px 14px 10px 16px;border-radius:16px}
  .ans::before{left:0;right:auto;top:12px;bottom:12px;width:3px;height:auto;border-radius:0 3px 3px 0}
  .ans .l{grid-row:1/span 3;font-size:11px;letter-spacing:.06em} .ans .tip{display:none}
  .ans .val{margin:0;font-size:18px} .ans .sub{margin:0;font-size:12px}
  .heroBody{padding-bottom:40px}
  .week7{gap:4px} .wkp{padding:6px 2px;border-radius:12px} .wkp .m{font-size:12px} }

/* SCRUBBER */
.scrub{background:rgba(4,18,26,.55);border:1px solid var(--edge);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:26px;padding:16px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;max-width:900px}
.scrub .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.scrub .head b{font-family:Unbounded,system-ui,sans-serif;font-size:15px}
.scrub .now{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:15px}
.scrub .head span{font-size:13px;color:var(--muted)}
.track{position:relative}
.bar,.heroBody{position:relative;z-index:1}
.sunlbl{position:absolute;z-index:0;transform:translate(-50%,8px);font-size:12px;font-weight:700;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none}
.dayline{position:relative;height:118px;border-radius:18px;overflow:hidden;border:1px solid var(--edge)}
.dayline svg.bg{position:absolute;inset:0;width:100%;height:100%}
.dayline input[type=range]{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:grab;z-index:3}
.dayline input[type=range]:active{cursor:grabbing}
.dayline:has(input:focus-visible){outline:3px solid var(--gold);outline-offset:3px}
.knob{position:absolute;top:0;bottom:0;width:0;z-index:2;pointer-events:none;transition:left .08s linear}
.knob::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:rgba(255,255,255,.7)}
.knob .orb{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Unbounded,system-ui,sans-serif;font-weight:800;font-size:13px;color:#2A1A05;background:radial-gradient(circle at 35% 30%,#FFF4D0,var(--sunc,#FFC861) 70%);box-shadow:0 0 0 6px rgba(255,200,97,.18),0 0 34px 6px var(--sunc,#FFC861)}
.knob.night .orb{color:#0B1B2A;background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9D6E6 70%);box-shadow:0 0 0 6px rgba(201,214,230,.15),0 0 26px 4px rgba(201,214,230,.6)}
.dtag{position:absolute;top:8px;z-index:1;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
.dtag.win{background:var(--gold);color:#1A1405}
.dtag.sun{background:rgba(4,18,26,.55);color:#fff;font-weight:700;top:auto;bottom:8px}
.winds{position:relative;height:26px;margin-top:8px}
.winds span{position:absolute;transform:translateX(-50%);top:0}
.ticks2{position:relative;height:16px;font-size:12px;color:var(--muted)}
.ticks2 span{position:absolute;transform:translateX(-50%)}
.ticks2 span:first-child{transform:none}.ticks2 span:last-child{transform:translateX(-100%)}
.playbtn{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--edge);background:rgba(255,255,255,.08);font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.playbtn:hover{background:rgba(255,255,255,.14)}
.ribbon{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;align-items:end;height:64px}
.ribbon span{display:block;border-radius:6px 6px 3px 3px;transition:opacity .2s}
.ribbon span.night{opacity:.35}
.ribbon span.win{box-shadow:0 0 16px rgba(255,182,72,.55)}
.ticks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));font-size:12px;color:var(--muted);margin-top:6px}
.ticks span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:-44px 0 0;position:relative;display:block;cursor:grab}
input[type=range]::-webkit-slider-runnable-track{height:64px;background:transparent}
input[type=range]::-moz-range-track{height:64px;background:transparent}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:78px;margin-top:-14px;border-radius:4px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 18px rgba(255,255,255,.6)}
input[type=range]::-moz-range-thumb{width:6px;height:78px;border:0;border-radius:4px;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 18px rgba(255,255,255,.6)}
.trackwrap{position:relative;padding-bottom:0}
.trackwrap input{position:absolute;left:0;right:0;top:0;margin:0;height:64px}
.live{display:grid;grid-template-columns:repeat(4,auto);gap:18px;align-items:center}
.live .k{font-size:12px;color:var(--muted);font-weight:600}
.live .v{font-family:Unbounded,system-ui,sans-serif;font-weight:700;font-size:20px;line-height:1.1;white-space:nowrap}
.live .s{font-size:12px;color:#CFE2E5;white-space:nowrap}
.windico{display:inline-block;vertical-align:-3px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.gauge{width:14px;height:40px;border-radius:7px;border:1px solid var(--edge);position:relative;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px}
.gauge i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--lilac),#6E5BD6);transition:height .35s}
@media (max-width:820px){ .scrub{grid-template-columns:1fr} .live{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:520px){ .ans .row{flex-direction:column;align-items:flex-start;gap:8px} .ans .row svg{width:60px;height:60px} }

/* SECTIONS */
section.blk{padding:44px 0 8px}
.h2{font-family:Unbounded,system-ui,sans-serif;font-size:clamp(20px,2.6vw,26px);font-weight:800;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 22px;max-width:60ch}

}

const rad = d => d*Math.PI/180;
const angDiff = (a,b) => { const d = Math.abs(((a-b)%360+360)%360); return d>180?360-d:d; };
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));

function seaPoint(s){ // point à ~3 km au large, pour éviter les mailles « terre » du modèle de vagues
  const d = 3/111;
  return [s.lat + d*Math.cos(rad(s.ori)), s.lon + d*Math.sin(rad(s.ori))/Math.cos(rad(s.lat))];
}

const WAVE_MODELS = [ // [clé, libellé, poids, noms possibles côté API]

const WIND_MODELS = [['arome','Météo-France AROME','meteofrance_seamless'],['icon','DWD ICON','icon_seamless'],['gfs','NOAA GFS','gfs_seamless'],['ecmwf','ECMWF IFS','ecmwf_ifs025']];
const CACHE_TTL = 45*60*1000, memCache = {};
function ckey(url){ let h=0; for(let i=0;i<url.length;i++){ h=(h*31+url.charCodeAt(i))|0; } return 'om:'+h; }
async function getJSON(url, tries=2){
  const k=ckey(url), now=Date.now();
  if(memCache[k] && now-memCache[k].t<CACHE_TTL) return memCache[k].d;
  try{ const c=JSON.parse(localStorage.getItem(k)||'null'); if(c && now-c.t<CACHE_TTL){ memCache[k]=c; return c.d; } }catch(e){}
  const r=await fetch(url);
  if(r.status===429 && tries>1){ await new Promise(res=>setTimeout(res,2500)); return getJSON(url,tries-1); }
  if(!r.ok){ const err=new Error(r.status===429?'trop de requêtes':String(r.status)); err.status=r.status; throw err; }
  const j=await r.json(); if(j&&j.error) throw new Error(j.reason||'erreur');
  const d=Array.isArray(j)?j:[j]; memCache[k]={t:now,d};
  try{ localStorage.setItem(k, JSON.stringify({t:now,d})); }catch(e){ try{ Object.keys(localStorage).filter(x=>x.startsWith('om:')).forEach(x=>localStorage.removeItem(x)); }catch(_){} }
  return d;
}
// Les spots proches tombent dans la même maille de modèle : on regroupe les points pour limiter les appels.
function gridPoints(list){ const pts=[], idx={}, map=list.map(p=>{ const k=(Math.round(p[0]/0.03)*0.03).toFixed(3)+','+(Math.round(p[1]/0.03)*0.03).toFixed(3); if(!(k in idx)){ idx[k]=pts.length; pts.push(p); } return idx[k]; }); return {pts,map}; }
const llq = pts => 'latitude='+pts.map(p=>p[0].toFixed(4)).join(',')+'&longitude='+pts.map(p=>p[1].toFixed(4)).join(',');
const MARINE = 'https://marine-api.open-meteo.com/v1/marine?', FORECAST='https://api.open-meteo.com/v1/forecast?', COMMON='&timezone=Europe%2FParis&forecast_days=7';
const modelName = {};
async function loadLive(){
  const sea=gridPoints(SPOTS.map(seaPoint)), land=gridPoints(SPOTS.map(s=>[s.lat,s.lon]));
  const mUrl = MARINE+llq(sea.pts)+COMMON+'&cell_selection=sea&hourly=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,secondary_swell_wave_height,secondary_swell_wave_period,secondary_swell_wave_direction,wind_wave_height,wind_wave_period,wind_wave_direction,sea_level_height_msl,sea_surface_temperature';
  const wUrl = FORECAST+llq(land.pts)+COMMON+'&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&models=meteofrance_seamless';
  const [Mu,Wu] = await Promise.all([ getJSON(mUrl).catch(e=>{throw new Error('vagues : '+e.message)}), getJSON(wUrl).catch(e=>{throw new Error('vent : '+e.message)}) ]);
  state.raw = SPOTS.map((s,i)=>({ m: structuredClone(Mu[sea.map[i]]), w: structuredClone(Wu[land.map[i]]) }));
  state.models=[]; state.windModels=[];
  state.data = SPOTS.map((s,i)=>analyse(s, state.raw[i].m, state.raw[i].w));
}
// Modèles détaillés (mix vagues + comparaison vent) : seulement pour le spot affiché, en tâche de fond.
async function enrich(i){
  if(state.mode==='server') return false;
  const s=SPOTS[i], raw=state.raw[i];
  if(raw.done){ state.models=WAVE_MODELS.filter(x=>raw.m._models?.[x[0]]).map(x=>({key:x[0],label:x[1]})); state.windModels=WIND_MODELS.filter(x=>raw.w._models?.[x[0]]).map(x=>({key:x[0],label:x[1]})); return false; }
  const sp=seaPoint(s), q='latitude='+sp[0].toFixed(4)+'&longitude='+sp[1].toFixed(4);
  const tryModel = async (key,names) => { const order = modelName[key] ? [modelName[key]] : names;
    for(const n of order){ try{ const d=await getJSON(MARINE+q+COMMON+'&cell_selection=sea&hourly=wave_height,wave_period,wave_direction&models='+n,1); modelName[key]=n; return d[0]; }catch(e){ if(e.status===429) return null; } } return null; };
  const wq='latitude='+s.lat+'&longitude='+s.lon;
  const [WM, wm] = await Promise.all([ Promise.all(WAVE_MODELS.map(x=>tryModel(x[0],x[3]))), getJSON(FORECAST+wq+COMMON+'&hourly=wind_speed_10m&models='+WIND_MODELS.map(x=>x[2]).join(','),1).then(d=>d[0]).catch(()=>null) ]);
  const m=raw.m, n=m.hourly.time.length, models={};
  WAVE_MODELS.forEach((x,k)=>{ const r=WM[k]; if(r&&r.hourly&&r.hourly.wave_height&&r.hourly.wave_height.length===n) models[x[0]]=r.hourly.wave_height; });
  const keys=Object.keys(models);
  if(keys.length){ const ws={}; WAVE_MODELS.forEach(x=>ws[x[0]]=x[2]); const baseH=m.hourly.wave_height.slice();
    m.hourly.wave_height=baseH.map((b0,j)=>{ let a=0,b=0; keys.forEach(k=>{ const v=models[k][j]; if(v!=null){a+=v*ws[k];b+=ws[k];} }); return b?a/b:b0; }); }
  m._models=models;
  const wmods={}; if(wm) WIND_MODELS.forEach(x=>{ const v=wm.hourly['wind_speed_10m_'+x[2]]; if(v) wmods[x[0]]=v; });
  raw.w._models=wmods; raw.done=true;
  state.models=WAVE_MODELS.filter(x=>models[x[0]]).map(x=>({key:x[0],label:x[1]}));
  state.windModels=WIND_MODELS.filter(x=>wmods[x[0]]).map(x=>({key:x[0],label:x[1]}));
  state.data[i]=analyse(s, m, raw.w);
  return true;
}

async function loadServer(){
  const r=await fetch('data/forecast.json',{cache:'no-cache'}); if(!r.ok) throw new Error('forecast.json '+r.status);
  const j=await r.json(); const byName={}; j.spots.forEach(x=>byName[x.name]=x);

function tideFactor(pref, phase, rising){

    case 'Basse → mi-montante': return phase==='basse'||(phase==='mi'&&rising)?1:0.7;

function windInfo(v, dir, off){

function analyse(s, m, w){

    else if(w2!=null && w2>=0.3 && w2>=0.4*(H||0) && g('wind_wave_period')!=null) sec={kind:'mer du vent',H:w2,T:g('wind_wave_period'),D:g('wind_wave_direction')};
    const v = w.hourly.wind_speed_10m[i], wd = w.hourly.wind_direction_10m[i];

    for(const k in (w._models||{})){ const v=w._models[k][i]; if(v!=null) h.wmodels[k]=v; }

    const Heff = h.H*expo*clamp((h.T||8)/10,0.6,1.35);

  return {spot:s, hours, days};
}

function summarise(date, list, sun){
  const rise = sun? +sun.rise.slice(0,2) : 8, set = sun? +sun.set.slice(0,2) : 18;
  const day = list.filter(h=>h.hour>=rise && h.hour<=set && h.score!=null);
  const dt = new Date(date+'T12:00:00');
  const label = DAYS_FR[dt.getDay()]+' '+dt.getDate();
  if(!day.length) return {date,label,score:0,tag:'—',verdict:'Pas de données pour ce jour.',size:'—',list,sun};
  let best = day.reduce((a,b)=>b.score>a.score?b:a);
  const max = best.score;
  // fenêtre continue autour du meilleur créneau
  const bi = day.indexOf(best); let a=bi,b=bi;
  while(b-a<3){ const L=a>0&&day[a-1].score>=max-0.3?day[a-1].score:-1, R=b<day.length-1&&day[b+1].score>=max-0.3?day[b+1].score:-1;
    if(L<0&&R<0) break; if(L>=R) a--; else b++; }
  if(a===b){ if(b<day.length-1&&(a===0||day[b+1].score>=day[a-1].score)) b++; else if(a>0) a--; } // au moins 2 h
  const win = day.slice(a,b+1);
  const hs = day.map(h=>h.H); const lo=Math.min(...hs), hi=Math.max(...hs);
  const size = (hi-lo<0.15)? '≈ '+fmt(hi)+' m' : fmt(lo)+'–'+fmt(hi)+' m';
  const sc = Math.round(max);
  const avgH = win.reduce((x,h)=>x+h.H,0)/win.length;
  const satHours = day.filter(h=>h.saturated).length;
  let verdict;
  if(satHours > day.length*0.6) verdict = 'Ça sature : trop gros pour ce spot. Cherche un spot plus abrité.';
  else if(max<0.6) verdict = 'Pas de surf.';
  else {
    const q = ['Pas de surf','Micro-surf','Petit surf','Bon surf','Très bon surf'][sc];
    const windTxt = {lisse:'plan d’eau lisse', offshore:'vent offshore', 'side-off':'vent side-off', 'de côté':'vent de côté', onshore:'vent onshore'}[best.wind];
    const span = win.length>=day.length-1 ? 'toute la journée' : 'de '+win[0].hour+'h à '+(win[win.length-1].hour+1)+'h';
    verdict = q+', vagues de '+fmt(avgH)+' m, '+windTxt+' '+span+'.';
    const late = day.filter(h=>h.hour>=15);
    if(late.length && late.every(h=>h.wind==='onshore') && best.wind!=='onshore') verdict += ' Le vent rentre onshore l’après-midi.';
  }
  return {date,label,score:Math.round(max*10)/10,sc,tag:TAGS[sc],verdict,size,best,win,list,sun,avgH};
}

function oceanInit(){
  if(OC.canvas) return;                                   // jamais deux fois

  try{ OC.gl=c.getContext('webgl',{antialias:false,premultipliedAlpha:false,powerPreference:'low-power'}); }catch(e){ OC.gl=null; }

function oceanDraw(now){
  const c=OC.canvas; if(!c) return;
  if(!OC.gl){   // sans WebGL : simple dégradé de ciel et de mer
    const p=palette(canon(OC.hour??state.hour)), rgb=v=>`rgb(${v.map(x=>Math.round(clamp(x,0,1)*255)).join(',')})`;
    c.style.background=`linear-gradient(180deg,${rgb(p.sT)} 0%,${rgb(p.sB)} 46%,${rgb(p.wS)} 52%,${rgb(p.wD)} 100%)`; return;
  }

  const W=Math.max(2,Math.floor(c.clientWidth*dpr)), H=Math.max(2,Math.floor(c.clientHeight*dpr));
  if(c.width!==W||c.height!==H){ c.width=W; c.height=H; gl.viewport(0,0,W,H); }
  OC.hour+=(OC.hourT-OC.hour)*(now<OC.introUntil?0.025:0.08);        // glissement doux de l'heure : soleil et couleurs
  const p=palette(canon(OC.hour)), sv=sunVec(OC.hour,W<H), deg=Math.asin(clamp(sv[1],-1,1))*180/Math.PI;

function oceanLoop(now){
  OC.raf=0;
  if(!OC.gl||OC.lost||document.hidden||!OC.visible) return;           // en pause : reprend au retour (oceanKick)
  const dt=now-OC.last;
  if(dt<32){ OC.raf=requestAnimationFrame(oceanLoop); return; }       // 30 images/s au plus
  OC.last=now;
  if(dt<250){                                                          // qualité adaptative : on mesure, on réduit si trop lent
    OC.dtSum+=dt; OC.frames++;
    if(OC.frames>=30){ const avg=OC.dtSum/OC.frames; OC.frames=0; OC.dtSum=0;
      if(avg>52){ if(OC.quality>0.46) OC.quality=Math.max(0.45,OC.quality*0.75); else OC.still=true; } }
  }
  oceanDraw(now);
  const settling=Math.abs(OC.hour-OC.hourT)>0.01;
  if(OC.still&&!settling) return;                                      // trop lent ou mouvement réduit : image fixe
  OC.raf=requestAnimationFrame(oceanLoop);
}
function oceanKick(){ if(!OC.raf&&OC.gl&&!OC.lost&&!document.hidden&&OC.visible) OC.raf=requestAnimationFrame(oceanLoop); }
/* Le canvas prend la hauteur du haut de page (qui change selon le contenu et l'écran) */
function oceanSync(){

  const h=hero.offsetHeight; if(h&&Math.abs(c.offsetHeight-h)>1) c.style.height=h+'px';
  if(OC.ro){ OC.ro.disconnect(); OC.ro.observe(hero); }

  if(!OC.raf){ OC.hour=OC.hourT; oceanDraw(performance.now()); }
  drawArc();
}
function oceanUpdate(){
  if(!OC.canvas) return;
  OC.hourT=state.hour;
  if(OC.hour==null){ const intro=!REDUCED&&!document.hidden; OC.hour=intro?(ocean.rise||8):state.hour; if(intro) OC.introUntil=performance.now()+4500; }

}

  $('tdS').textContent=ex.length?(exact?'':'≈ ')+ex.filter(x=>x.hd>=5&&x.hd<=22).map(x=>x.type+' '+x.hm).join(' · '):'Horaires indisponibles';
  const hs_=$('hcSwell'), hw_=$('hcWind');
  if(hs_&&h.D!=null){ hs_.setAttribute('transform',`rotate(${h.D.toFixed(0)})`); $('hcS').textContent=`Houle ${sector(h.D)} · ${Math.round(h.T||0)} s`; }
  if(hw_&&h.wd!=null){ hw_.setAttribute('transform',`rotate(${h.wd.toFixed(0)})`); const wc=windCol(h.wind); hw_.querySelector('line').setAttribute('stroke',wc); hw_.querySelector('path').setAttribute('fill',wc); $('hcWi').style.background=wc; $('hcW').textContent=`Vent ${sector(h.wd)} · ${Math.round(h.v)} km/h`; }
  const rs=$('roseSwell'), rw=$('roseWind'); if(rs&&h.D!=null) rs.setAttribute('transform',`rotate(${h.D.toFixed(0)})`); if(rw&&h.wd!=null) rw.setAttribute('transform',`rotate(${h.wd.toFixed(0)})`);
  oceanUpdate();
}

function renderPicker(){
  const q=state.q.trim().toLowerCase();
  let items=state.data.map((x,i)=>({x,i})).filter(({x})=>!q||x.spot.name.toLowerCase().includes(q)||(x.spot.commune||'').toLowerCase().includes(q));
  if(state.filter==='fav') items=items.filter(({x})=>state.fav.includes(x.spot.name));
  if(state.filter==='best') items.sort((a,b)=>(dayMed(b.x.days[0])||0)-(dayMed(a.x.days[0])||0));
  let html='',reg=null;
  items.forEach(({x,i})=>{
    if(state.filter==='geo'&&x.spot.region!==reg){reg=x.spot.region;html+=`<div class="grp">${reg}</div>`;}
    html+=`<button class="it" data-i="${i}"><span><span class="n">${x.spot.name}</span><br><span class="c">${x.spot.commune}</span></span><span class="m">${medTxt(x.days[0])}</span></button>`;
  });
  if(!items.length) html = state.filter==='fav' ? '<p class="empty">Aucun spot enregistré. Touche l’étoile sur un spot pour le retrouver ici.</p>' : '<p class="empty">Aucun spot ne correspond. Essaie un autre nom ou une ville.</p>';
  document.getElementById('pkList').innerHTML=html;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===state.filter));
}

function refreshModels(){ const i=state.spot; enrich(i).then(ch=>{ if(ch && state.spot===i){ const h=state.hour, y=scrollY; render(); state.hour=h; updateLive(); scrollTo(0,y); } else if(state.spot===i){ const g=document.querySelector('#szC'); if(g) updateLive(); } }).catch(()=>{}); }
function go(i){ state.spot=i; render(); refreshModels(); window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'}); }
function bind(){
  { const ws=document.getElementById('wSel'); if(ws) ws.onchange=()=>{ state.weight=+ws.value; saveWeight(state.weight); const el=document.getElementById('gBoard'); if(el){ el.innerHTML=gearBoardHtml(); bindTips(el); } }; }
  document.getElementById('openPicker').onclick=()=>{ renderPicker(); document.getElementById('picker').showModal(); document.getElementById('q').focus(); };
  document.getElementById('favBtn').onclick=()=>{ const n=state.data[state.spot].spot.name; state.fav=state.fav.includes(n)?state.fav.filter(x=>x!==n):[...state.fav,n]; saveFav(); render(); };
  document.querySelectorAll('.hgrid .hc').forEach(c=>{ c.addEventListener('click',()=>{ if(playing){cancelAnimationFrame(playing);playing=0;} state.hour=+c.dataset.h; updateLive(); }); });
  document.getElementById('playDay').onclick=playDay;
  document.getElementById('cmpBtn').onclick=()=>{ state.cmp=!state.cmp; const y=scrollY; render(); scrollTo(0,y); };
  bindTips(document);
  function bindTips(root){ root.querySelectorAll('.tipbtn').forEach(b=>{ b.onmouseenter=()=>showTip(b); b.onmouseleave=()=>hideTip(); b.onfocus=()=>showTip(b); b.onblur=()=>hideTip(); b.onclick=e=>{ e.stopPropagation(); (tipOwner===b&&tipLayer.classList.contains('on'))?hideTip(true):showTip(b); }; }); }
  const tr=document.getElementById('tideRange'); if(tr) tr.addEventListener('input',e=>{ if(playing){cancelAnimationFrame(playing);playing=0;} state.hour=+e.target.value; updateLive(); });
  document.querySelectorAll('.nearit').forEach(b=>{ b.onclick=()=>go(+b.dataset.i); const i=+b.dataset.i; b.onmouseenter=()=>{ const el=markers[i]?.getElement()?.querySelector('.mk'); el&&el.classList.add('hl'); }; b.onmouseleave=()=>{ const el=markers[i]?.getElement()?.querySelector('.mk'); el&&el.classList.remove('hl'); }; });
  const ct=null;
  if(ct){ const dots=[...document.querySelectorAll('.cdots i')]; const idx=()=>Math.round(ct.scrollLeft/ct.clientWidth);
    const to=n=>ct.scrollTo({left:clamp(n,0,2)*ct.clientWidth,behavior:REDUCED?'auto':'smooth'});
    document.getElementById('cPrev').onclick=()=>to(idx()-1); document.getElementById('cNext').onclick=()=>to(idx()+1);
    ct.addEventListener('scroll',()=>{ const n=idx(); dots.forEach((d,j)=>d.classList.toggle('on',j===n)); },{passive:true}); }
  initMap();
  document.getElementById('spotBtn').onclick=()=>document.getElementById('openPicker').click();
  document.querySelectorAll('.daycard,.wkp').forEach(b=>b.onclick=()=>{ state.day=+b.dataset.d; render(); window.scrollTo({top:0,behavior:REDUCED?'auto':'smooth'}); });
  document.querySelectorAll('.topit').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.querySelectorAll('.spotdot').forEach(g=>{ g.addEventListener('click',()=>go(+g.dataset.i)); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go(+g.dataset.i);} }); });
}
document.getElementById('pkClose').onclick=()=>document.getElementById('picker').close();
document.getElementById('pkList').addEventListener('click',e=>{const b=e.target.closest('.it'); if(!b)return; document.getElementById('picker').close(); go(+b.dataset.i);});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value; renderPicker();});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{state.filter=b.dataset.f; renderPicker();});

async function start(){
  oceanInit();
  window.addEventListener('resize',()=>{ if(state.data) oceanSync(); });
  try{
    await load();
    const favIdx = state.data.findIndex(x=>state.fav.includes(x.spot.name));
    state.spot = favIdx>=0 ? favIdx : 0;
    render(); refreshModels();
  }catch(err){
    document.getElementById('app').innerHTML=`<div class="loading"><div class="disp">Les prévisions n’ont pas pu être chargées</div><div style="color:var(--muted);max-width:46ch">${/trop de requêtes|429/.test(err.message)?'Le service météo gratuit limite le nombre de requêtes et la limite est atteinte. Attends une à deux minutes, puis réessaie.':err.message+'. Vérifie ta connexion internet, puis réessaie.'}</div><button class="retry" onclick="location.reload()">Réessayer</button></div>`;
  }
}
start();
</script>
</body>
</html>
