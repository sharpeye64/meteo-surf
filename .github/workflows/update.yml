name: Mise à jour des prévisions

on:
  schedule:
    # Une fois par heure environ (UTC, trois séries décalées de 3 h), à des minutes « calmes » : GitHub saute des passages programmés quand il est chargé
    # (constaté le 11/11/2026 : 9 h sans aucun passage avec une seule programmation toutes les 3 h). Trois séries décalées = moins de trous (1 h entre deux passages si rien n'est sauté).
    - cron: "17 0,3,6,9,12,15,18,21 * * *"
    - cron: "47 1,4,7,10,13,16,19,22 * * *"
    - cron: "32 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: {}        # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
  pull_request:                # pull request vers main : SEULEMENT les tests de sûreté (aucun appel réseau, aucune publication)
    branches: [main]

permissions:
  contents: write   # écriture de l'archive sur la branche « history » (jamais sur main)
  pages: write
  id-token: write

concurrency:
  # par branche : un essai lancé à la main sur une branche de test n'annule jamais un passage de production (main)
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surete:
    # tests de sûreté (issue #3) : sources simulées, aucun appel réseau, rien n'est publié. Bloquent la suite s'ils échouent.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test hors ligne
        # écrit dans un dossier temporaire (jamais dans web/), marqué « test », et vérifie que web/ n'a pas bougé
        run: python -m tests.test_offline
      - name: Simulations de pannes (le contrôle doit refuser chaque site abîmé)
        run: python -m tests.simulate_pannes
      - name: Panne de bout en bout et fausses clés (aucune fuite, publication refusée)
        run: python -m tests.panne_bout_en_bout
      - name: Cache des prévisions Open-Meteo (issue #7)
        run: python -m tests.test_cache
      - name: Alignement horaire des prévisions (panne partielle, minuit)
        run: python -m tests.test_alignement
      - name: Contrat horaire du robot (France, Portugal, changements d'heure)
        run: python -m tests.test_heures
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Heures du site et de l'appli dans 4 fuseaux de téléphone (issue #2)
        run: |
          for tz in Europe/Paris Europe/Lisbon America/New_York Asia/Tokyo; do
            echo "::group::fuseau $tz"
            TZ=$tz node tests/heures_site.test.js
            TZ=$tz node tests/heures_app.test.mjs
            echo "::endgroup::"
          done
  build:
    needs: surete
    # pas de vraie génération pour une pull request (ni appel aux API, ni archive, ni publication)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Préparer le dossier de publication
        # le robot génère dans _site/ (copie des sources du site) ; seul _site/ contrôlé est envoyé
        run: rm -rf _site && cp -r web _site
      - name: Récupérer l'archive prévision/réalité (branche history)
        run: |
          git fetch --depth=1 origin history:history 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/history; then
            git worktree add history history
          else
            git worktree add --detach history
            git -C history checkout --orphan history
            git -C history rm -rf --quiet . || true
          fi
      - name: Récupérer le cache des prévisions Open-Meteo
        # prévisions déjà reçues : réutilisées tant qu'aucun modèle n'a publié de nouveau run (pipeline/omcache.py, issue #7)
        uses: actions/cache/restore@v4
        continue-on-error: true   # service de cache en panne : on redemande tout, la génération continue
        with:
          path: .cache/openmeteo
          key: openmeteo-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: openmeteo-${{ github.ref_name }}-
      - name: Récupérer les compteurs Open-Meteo du jour
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/usage
          key: omusage-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: omusage-${{ github.ref_name }}-
      - name: Construire forecast.json
        env:
          METEO_SITE_URL: "https://houlalah.fr"
          METEOFRANCE_APIKEY: ${{ secrets.METEOFRANCE_APIKEY }}
          METEO_OUT_DIR: _site
        run: |
          rm -f .cache/openmeteo/CHANGED   # recréé par le robot seulement si le cache change pendant ce passage
          # L'archive prévision/réalité reste à un passage toutes les 3 h (UTC) : sinon elle grossirait 3 fois plus vite pour rien.
          # Jamais d'archive depuis une branche de test.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ]; then export METEO_ARCHIVE=1; fi
          # Une panne passagère d'Open-Meteo ne doit pas bloquer la mise en ligne : 3 tentatives espacées de 2 min.
          for n in 1 2 3; do
            python -m pipeline.build && exit 0
            echo "::warning::Construction échouée (tentative $n/3)"
            [ $n -lt 3 ] && sleep 120
          done
          exit 1
      - name: Sauvegarder le cache des prévisions Open-Meteo
        # seulement s'il a changé (nouveau run d'un modèle) : pas de copie inutile à chaque passage
        if: hashFiles('.cache/openmeteo/CHANGED') != ''
        uses: actions/cache/save@v4
        continue-on-error: true   # un échec de sauvegarde ne bloque jamais une génération valide
        with:
          path: .cache/openmeteo
          key: openmeteo-${{ github.ref_name }}-${{ github.run_id }}
      - name: Sauvegarder les compteurs Open-Meteo du jour
        if: hashFiles('.cache/usage/*.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/usage
          key: omusage-${{ github.ref_name }}-${{ github.run_id }}
      - name: Contrôler le site avant publication
        # refuse un site incomplet, incohérent ou contenant des données de test : la publication n'a pas lieu
        # et GitHub Pages garde la dernière version valide (tools/check_site.py, issue #3)
        env:
          METEOFRANCE_APIKEY: ${{ secrets.METEOFRANCE_APIKEY }}   # seulement pour vérifier que sa valeur n'apparaît dans AUCUN fichier publié
        run: python -m tools.check_site _site --max-age-h 3
      - name: Enregistrer l'archive
        id: archive
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # un échec d'archivage ne doit jamais empêcher la publication du site
        run: |
          cd history
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau à archiver"; exit 0; fi
          git -c user.name="meteo-surf-bot" -c user.email="actions@users.noreply.github.com" commit -q -m "Archive $(date -u +%FT%TZ)"
          git push origin HEAD:history
      - name: Signaler un échec d'archivage
        # l'archive ne bloque pas la publication, mais son échec doit se voir (annotation + résumé du passage)
        if: steps.archive.outcome == 'failure'
        run: |
          echo "::warning::Archive non enregistrée sur la branche history (voir l'étape « Enregistrer l'archive »)"
          echo "### ⚠️ Archive non enregistrée sur la branche history" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    # seule la branche main publie houlalah.fr ; un essai sur une autre branche s'arrête au contrôle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
